<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة غير موجودة - نظام متابعة المعاملات</title>
    <style>
        :root {
            --font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            --bg-deep: #030712;
            --card-bg: #0b1329;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --radius: 20px;
        }

        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

        * { box-sizing: border-box; font-family: var(--font-family); margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .error-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            border-radius: var(--radius);
            padding: 36px 28px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .error-code {
            font-size: 48px;
            font-weight: 900;
            color: #3b82f6;
            letter-spacing: -1px;
            margin-bottom: -6px;
        }

        h1 {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
        }

        p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .back-btn {
            display: block;
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 11px;
            font-size: 14.5px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .back-btn:hover {
            background: var(--primary-hover);
        }

        .redirect-timer {
            font-size: 11.5px;
            color: var(--text-muted);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-code">404</div>
        <h1>الصفحة المطلوبة غير موجودة</h1>
        <p>عذراً، الرابط الذي قمت بالوصول إليه غير صحيح أو تم نقل الصفحة. سيتم توجيهك تلقائياً لواجهة تسجيل الدخول.</p>
        
        <a href="login.html" class="back-btn">العودة لتسجيل الدخول الآن</a>
        <div class="redirect-timer" id="timerText">التحويل خلال 5 ثوانٍ...</div>
    </div>

    <script>
        // عداد تنازلي للتحويل التلقائي بعد 5 ثوانٍ إلى صفحة تسجيل الدخول
        let secondsLeft = 5;
        const timerText = document.getElementById('timerText');

        const countdown = setInterval(() => {
            secondsLeft--;
            if (secondsLeft > 0) {
                timerText.textContent = `التحويل خلال ${secondsLeft} ثوانٍ...`;
            } else {
                clearInterval(countdown);
                window.location.replace("login.html");
            }
        }, 1000);
    </script>
</body>
</html>
