<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام متابعة المعاملات</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            direction: ltr;
            text-align: left;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #error-message {
            color: red;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="1@1.com">
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit">دخول</button>
            <div id="error-message"></div>
        </form>
    </div>

    <!-- استيراد مكتبات Firebase عبر CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // إعدادات مشروع الـ Firebase الخاص بك
        const firebaseConfig = {
          apiKey: "AIzaSyC4tcL7HF_eWO2r7JH3D8ptnyTuwk0vSlw",
          authDomain: "project-3958113961260211077.firebaseapp.com",
          projectId: "project-3958113961260211077",
          storageBucket: "project-3958113961260211077.firebasestorage.app",
          messagingSenderId: "889377835896",
          appId: "1:889377835896:web:bbbb74e99b3585c9d8168d"
        };

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            errorMessage.textContent = "جاري تسجيل الدخول...";

            try {
                // ضبط الحفظ ليبقى مسجلاً في المتصفح
                await setPersistence(auth, browserLocalPersistence);
                
                // تسجيل الدخول
                await signInWithEmailAndPassword(auth, email, password);
                
                // تأخير بسيط لضمان استقرار جلسة الـ Firebase قبل الانتقال
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 500);

            } catch (error) {
                console.error("خطأ في تسجيل الدخول:", error.code);
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    errorMessage.textContent = "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
                } else {
                    errorMessage.textContent = "حدث خطأ: " + error.message;
                }
            }
        });
    </script>
</body>
</html>
