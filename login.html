<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام متابعة المعاملات</title>
    <style>
        :root {
            --font-family: 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --bg-deep: #020617;
            --bg-card: #0f172a;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-glow: rgba(37, 99, 235, 0.25);
            --radius: 16px;
        }

        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');

        * { box-sizing: border-box; font-family: var(--font-family); }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية رسمية هادئة */
        body::before {
            content: '';
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 300px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.12) 0%, transparent 70%);
            z-index: -1;
        }

        .login-card-container {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border-radius: var(--radius);
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
        }

        /* رأس الواجهة والعنوان الرسمي */
        .system-brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .system-brand-header .icon-box {
            width: 50px;
            height: 50px;
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.3);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #3b82f6;
            margin-bottom: 12px;
        }

        .system-brand-header h1 {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 6px 0;
        }

        .system-brand-header p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
        }

        /* بطاقات الإحصائيات الرسمية */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .metric-box {
            background: #020617;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .metric-box.warning { border-right: 3px solid #f59e0b; }
        .metric-box.danger { border-right: 3px solid #ef4444; }

        .metric-info { display: flex; flex-direction: column; gap: 2px; }
        .metric-label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
        .metric-value { font-size: 18px; font-weight: 800; }

        .metric-box.warning .metric-value { color: #fbbf24; }
        .metric-box.danger .metric-value { color: #f87171; }

        .metric-icon { font-size: 16px; }

        /* نموذج الدخول */
        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 12.5px;
            font-weight: 600;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: #020617;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            text-align: right;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 6px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        #error-message {
            color: #f87171;
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            font-weight: 600;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 24px;
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card-container">
        <div class="system-brand-header">
            <div class="icon-box">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h1>نظام متابعة المعاملات</h1>
            <p>يرجى إدخال البيانات للاعتماد والدخول</p>
        </div>

        <!-- لوحة الإحصائيات المصغرة الرسمية -->
        <div class="metrics-grid">
            <div class="metric-box warning">
                <div class="metric-info">
                    <span class="metric-label">قريبة الاستحقاق</span>
                    <span class="metric-value" id="loginCountApproaching">0</span>
                </div>
                <div class="metric-icon">⏳</div>
            </div>
            
            <div class="metric-box danger">
                <div class="metric-info">
                    <span class="metric-label">متأخرة</span>
                    <span class="metric-value" id="loginCountDelayed">0</span>
                </div>
                <div class="metric-icon">⚠️</div>
            </div>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">اسم المستخدم أو البريد الإلكتروني</label>
                <input type="text" id="username" required placeholder="admin أو 1@1.com">
            </div>
            
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="submit-btn">تسجيل الدخول</button>
            <div id="error-message"></div>
        </form>

        <div class="footer-note">
            جميع الحقوق محفوظة © النظام الإداري الموحد
        </div>
    </div>

    <!-- كود الاتصال والتحقق Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC4tcL7HF_eWO2r7JH3D8ptnyTuwk0vSlw",
          authDomain: "project-3958113961260211077.firebaseapp.com",
          projectId: "project-3958113961260211077",
          storageBucket: "project-3958113961260211077.firebasestorage.app",
          messagingSenderId: "889377835896",
          appId: "1:889377835896:web:bbbb74e99b3585c9d8168d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function getTodayHijriString() {
            try {
                let formatter = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', {
                    year: 'numeric', month: '2-digit', day: '2-digit'
                });
                let parts = formatter.formatToParts(new Date());
                let y = parts.find(p => p.type === 'year').value;
                let m = parts.find(p => p.type === 'month').value;
                let d = parts.find(p => p.type === 'day').value;
                return `${y}-${m}-${d}`;
            } catch (e) {
                return "1447-04-01";
            }
        }

        function parseHijriToDate(hijriStr) {
            if (!hijriStr) return new Date();
            let parts = hijriStr.split(/[-/]/);
            if (parts.length !== 3) return new Date();
            let hy = parseInt(parts[0], 10);
            let hm = parseInt(parts[1], 10);
            let hd = parseInt(parts[2], 10);
            let estimatedGregorianYear = Math.round(hy * 0.9702 + 621.56);
            return new Date(estimatedGregorianYear, hm - 1, hd);
        }

        async function fetchLoginStats() {
            try {
                const querySnapshot = await getDocs(collection(db, "transactions"));
                let todayDate = parseHijriToDate(getTodayHijriString());
                todayDate.setHours(0,0,0,0);

                let delayedCount = 0;
                let approachingCount = 0;

                querySnapshot.forEach((docSnap) => {
                    let data = docSnap.data();
                    if (data.status === 'أنجزت') return;
                    
                    let dueD = parseHijriToDate(data.dueDate);
                    dueD.setHours(0,0,0,0);
                    let diffDays = Math.round((dueD - todayDate) / (1000 * 60 * 60 * 24));
                    
                    if (diffDays < 0) {
                        delayedCount++;
                    } else if (diffDays <= 4) {
                        approachingCount++;
                    }
                });

                document.getElementById('loginCountDelayed').innerText = delayedCount;
                document.getElementById('loginCountApproaching').innerText = approachingCount;
            } catch (error) {
                console.error("خطأ في جلب الإحصائيات:", error);
            }
        }

        fetchLoginStats();

        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            let userInput = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            const mappedEmail = userInput.includes('@') ? userInput : `${userInput}@24tm.local`;

            errorMessage.style.color = "#93c5fd";
            errorMessage.textContent = "جاري المصادقة والانتقال...";

            try {
                await setPersistence(auth, browserLocalPersistence);
                await signInWithEmailAndPassword(auth, mappedEmail, password);
                
                setTimeout(() => {
                    window.location.replace("index.html");
                }, 500);

            } catch (error) {
                console.error("خطأ في تسجيل الدخول:", error.code);
                errorMessage.style.color = "#f87171";
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    errorMessage.textContent = "اسم المستخدم أو كلمة المرور غير صحيحة.";
                } else {
                    errorMessage.textContent = "حدث خطأ في النظام: " + error.message;
                }
            }
        });
    </script>
</body>
</html>
