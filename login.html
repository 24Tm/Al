<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - متابعة المعاملات اليومية</title>
    
    <!-- استيراد مكتبات Firebase (SDK الإصدار 10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC4tcL7HF_eWO2r7JH3D8ptnyTuwk0vSlw",
          authDomain: "project-3958113961260211077.firebaseapp.com",
          projectId: "project-3958113961260211077",
          storageBucket: "project-3958113961260211077.firebasestorage.app",
          messagingSenderId: "889377835896",
          appId: "1:889377835896:web:bbbb74e99b3585c9d8168d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.handleLogin = function(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorMsg = document.getElementById('errorMessage');

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // تسجيل دخول ناجح والانتقال للوحة الرئيسية
                    window.location.replace("index.html");
                })
                .catch((error) => {
                    errorMsg.style.display = 'block';
                    errorMsg.innerText = "خطأ في البريد الإلكتروني أو كلمة المرور.";
                });
        };
    </script>

    <style>
        :root {
            --font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            --bg-deep: #030712;
            --bg-card: rgba(17, 24, 39, 0.85);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --border: rgba(55, 65, 81, 0.5);
            --radius: 14px;
        }

        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

        * { box-sizing: border-box; font-family: var(--font-family); }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            direction: rtl;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(to left, #60a5fa, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .form-item {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 13px;
            background: #030712;
            color: var(--text-main);
            text-align: right;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .btn-login {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: brightness 0.2s;
        }

        .btn-login:hover {
            filter: brightness(1.1);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول</h2>
        <div id="errorMessage" class="error-message"></div>
        
        <form onsubmit="handleLogin(event)">
            <div class="form-item">
                <label>البريد الإلكتروني:</label>
                <input type="email" id="loginEmail" placeholder="example@domain.com" required>
            </div>
            <div class="form-item">
                <label>كلمة المرور:</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">دخول للوحة التحكم</button>
        </form>
    </div>

</body>
</html>
