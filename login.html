<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام متابعة المعاملات</title>
    <style>
        :root {
            --font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            --bg-deep: #090d16;
            --card-bg: #0f172a;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --radius: 20px;
        }

        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

        * { box-sizing: border-box; font-family: var(--font-family); margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            border-radius: var(--radius);
            padding: 28px 22px;
            display: flex;
            flex-direction: column;
            align-center: center;
        }

        /* الهيدر النظيف */
        .header-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-section h1 {
            font-size: 17px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .header-section p {
            font-size: 11.5px;
            color: var(--text-muted);
        }

        /* بطاقات الإحصائيات النظيفة */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #030712;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: center;
        }

        .stat-card.warning { border-top: 2px solid #f59e0b; }
        .stat-card.danger { border-top: 2px solid #ef4444; }

        .stat-title { font-size: 10.5px; color: var(--text-muted); font-weight: 700; }
        .stat-number { font-size: 18px; font-weight: 900; }

        .stat-card.warning .stat-number { color: #fbbf24; }
        .stat-card.danger .stat-number { color: #f87171; }

        /* نموذج الإدخال */
        .input-group {
            margin-bottom: 14px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 11.5px;
            font-weight: 700;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            background: #030712;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #ffffff;
            font-size: 13.5px;
            text-align: right;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .login-action-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 14.5px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .login-action-btn:hover {
            background: var(--primary-hover);
        }

        #error-message {
            color: #f87171;
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- الهيدر -->
        <div class="header-section">
            <h1>نظام متابعة المعاملات</h1>
            <p>تسجيل الدخول للاعتماد</p>
        </div>

        <!-- بطاقات الإحصائيات -->
        <div class="stats-row">
            <div class="stat-card warning">
                <span class="stat-title">⏳ قريبة الاستحقاق</span>
                <span class="stat-number" id="loginCountApproaching">0</span>
            </div>
            
            <div class="stat-card danger">
                <span class="stat-title">⚠️ معاملات متأخرة</span>
                <span class="stat-number" id="loginCountDelayed">0</span>
            </div>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form id="login-form">
            <div class="input-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" required placeholder="admin">
            </div>
            
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="login-action-btn">دخول</button>
            <div id="error-message"></div>
        </form>
    </div>

    <!-- كود الربط والتحقق Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC4tcL7HF_eWO2r7JH3D8ptnyTuwk0vSlw",
          authDomain: "project-3958113961260211077.firebaseapp.com",
          projectId: "project-3958113961260211077",
          storageBucket: "project-3958113961260211077.firebasestorage.app",
          messagingSenderId: "889377835896",
          appId: "1:889377835896:web:bbbb74e99b3585c9d8168d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function getTodayHijriString() {
            try {
                let formatter = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', {
                    year: 'numeric', month: '2-digit', day: '2-digit'
                });
                let parts = formatter.formatToParts(new Date());
                let y = parts.find(p => p.type === 'year').value;
                let m = parts.find(p => p.type === 'month').value;
                let d = parts.find(p => p.type === 'day').value;
                return `${y}-${m}-${d}`;
            } catch (e) {
                return "1447-04-01";
            }
        }

        function parseHijriToDate(hijriStr) {
            if (!hijriStr) return new Date();
            let parts = hijriStr.split(/[-/]/);
            if (parts.length !== 3) return new Date();
            let hy = parseInt(parts[0], 10);
            let hm = parseInt(parts[1], 10);
            let hd = parseInt(parts[2], 10);
            let estimatedGregorianYear = Math.round(hy * 0.9702 + 621.56);
            return new Date(estimatedGregorianYear, hm - 1, hd);
        }

        async function fetchLoginStats() {
            try {
                const querySnapshot = await getDocs(collection(db, "transactions"));
                let todayDate = parseHijriToDate(getTodayHijriString());
                todayDate.setHours(0,0,0,0);

                let delayedCount = 0;
                let approachingCount = 0;

                querySnapshot.forEach((docSnap) => {
                    let data = docSnap.data();
                    if (data.status === 'أنجزت') return;
                    
                    let dueD = parseHijriToDate(data.dueDate);
                    dueD.setHours(0,0,0,0);
                    let diffDays = Math.round((dueD - todayDate) / (1000 * 60 * 60 * 24));
                    
                    if (diffDays < 0) {
                        delayedCount++;
                    } else if (diffDays <= 4) {
                        approachingCount++;
                    }
                });

                document.getElementById('loginCountDelayed').innerText = delayedCount;
                document.getElementById('loginCountApproaching').innerText = approachingCount;
            } catch (error) {
                console.error("خطأ في جلب الإحصائيات:", error);
            }
        }

        fetchLoginStats();

        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            let userInput = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            const mappedEmail = userInput.includes('@') ? userInput : `${userInput}@24tm.local`;

            errorMessage.style.color = "#93c5fd";
            errorMessage.textContent = "جاري التحقق...";

            try {
                await setPersistence(auth, browserLocalPersistence);
                await signInWithEmailAndPassword(auth, mappedEmail, password);
                
                setTimeout(() => {
                    window.location.replace("index.html");
                }, 500);

            } catch (error) {
                console.error("خطأ في تسجيل الدخول:", error.code);
                errorMessage.style.color = "#f87171";
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    errorMessage.textContent = "اسم المستخدم أو كلمة المرور غير صحيحة.";
                } else {
                    errorMessage.textContent = "تعذر تسجيل الدخول.";
                }
            }
        });
    </script>
</body>
</html>
