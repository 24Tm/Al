<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة المعاملات اليومية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header Navigation -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-brand-600 p-2 rounded-lg text-white">
                    <i class="fas me-1 fa-file-invoice text-xl"></i>
                </div>
                <h1 class="text-xl font-bold tracking-wide">متابعة المعاملات اليومية</h1>
            </div>
            
            <div class="flex items-center space-x-4 space-x-reverse">
                <span id="userEmail" class="text-sm text-slate-400 hidden md:inline"></span>
                <button id="logoutBtn" class="bg-rose-600 hover:bg-rose-700 text-white text-sm px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>تسجيل الخروج</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Dashboard Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-sm font-medium">إجمالي المعاملات</p>
                    <h3 id="statTotal" class="text-3xl font-bold mt-1">0</h3>
                </div>
                <div class="p-3 bg-slate-700/50 rounded-lg text-blue-400">
                    <i class="fas fa-folder-open text-2xl"></i>
                </div>
            </div>

            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-sm font-medium">جاري العمل</p>
                    <h3 id="statPending" class="text-3xl font-bold text-amber-400 mt-1">0</h3>
                </div>
                <div class="p-3 bg-amber-500/10 rounded-lg text-amber-400">
                    <i class="fas fa-clock text-2xl"></i>
                </div>
            </div>

            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-sm font-medium">المعاملات المنجزة</p>
                    <h3 id="statCompleted" class="text-3xl font-bold text-emerald-400 mt-1">0</h3>
                </div>
                <div class="p-3 bg-emerald-500/10 rounded-lg text-emerald-400">
                    <i class="fas fa-check-circle text-2xl"></i>
                </div>
            </div>

            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-sm font-medium">المعاملات المتأخرة</p>
                    <h3 id="statOverdue" class="text-3xl font-bold text-rose-400 mt-1">0</h3>
                </div>
                <div class="p-3 bg-rose-500/10 rounded-lg text-rose-400">
                    <i class="fas fa-exclamation-triangle text-2xl"></i>
                </div>
            </div>
        </div>

        <!-- Action Bar & Add Form Button -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
            <h2 class="text-xl font-bold text-slate-200">سجل المعاملات اليومية</h2>
            <button id="openModalBtn" class="w-full sm:w-auto bg-brand-600 hover:bg-brand-700 text-white font-medium px-5 py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2">
                <i class="fas fa-plus"></i>
                <span>إضافة معاملة جديدة</span>
            </button>
        </div>

        <!-- Transactions Table Container -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-right text-slate-300">
                    <thead class="bg-slate-900/50 text-slate-400 text-xs uppercase border-b border-slate-700">
                        <tr>
                            <th class="px-6 py-4">رقم المعاملة</th>
                            <th class="px-6 py-4">الجهة / الموضوع</th>
                            <th class="px-6 py-4">تاريخ الوارد</th>
                            <th class="px-6 py-4">تاريخ الاستحقاق</th>
                            <th class="px-6 py-4">الحالة</th>
                            <th class="px-6 py-4 text-center">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="transactionsTableBody" class="divide-y divide-slate-700">
                        <!-- Content populated dynamically -->
                        <tr>
                            <td colspan="6" class="px-6 py-8 text-center text-slate-500">
                                جاري تحميل البيانات...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal for Add/Edit Transaction -->
    <div id="transactionModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-lg w-full p-6 shadow-2xl relative">
            <button id="closeModalBtn" class="absolute top-4 left-4 text-slate-400 hover:text-slate-200">
                <i class="fas fa-times text-lg"></i>
            </button>
            <h3 id="modalTitle" class="text-xl font-bold text-slate-100 mb-6">إضافة معاملة جديدة</h3>
            
            <form id="transactionForm" class="space-y-4">
                <input type="hidden" id="txDocId">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">رقم المعاملة</label>
                    <input type="text" id="txNumber" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">الجهة أو الموضوع</label>
                    <input type="text" id="txSubject" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-brand-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">تاريخ الوارد</label>
                        <input type="date" id="txIncomingDate" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">تاريخ الاستحقاق</label>
                        <input type="date" id="txDueDate" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-brand-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">حالة المعاملة</label>
                    <select id="txStatus" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-brand-500">
                        <option value="قيد المتابعة">قيد المتابعة</option>
                        <option value="منجزة">منجزة</option>
                        <option value="متأخرة">متأخرة</option>
                    </select>
                </div>
                <div class="pt-4 flex justify-end gap-3">
                    <button type="button" id="cancelModalBtn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-lg text-sm">إلغاء</button>
                    <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2 rounded-lg text-sm font-medium">حفظ المعاملة</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "
