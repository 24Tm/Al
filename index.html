<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة ومتابعة المعاملات</title>
    <style>
        :root {
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --bg-body: #f1f5f9;
            --sidebar-bg: #0f172a;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --border: #cbd5e1;
            --border-light: #e2e8f0;
            --radius-sm: 8px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
            direction: rtl;
        }

        .dashboard-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* رأس الصفحة الاحترافي */
        .top-navbar {
            background: var(--sidebar-bg);
            color: #ffffff;
            padding: 20px 28px;
            border-radius: var(--radius-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-md);
            margin-bottom: 24px;
        }

        .brand-title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .auth-trigger {
            background: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .auth-trigger:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* لوحة المؤشرات الإحصائية */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            text-align: center;
        }

        .metric-card .label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .metric-card .val {
            font-size: 28px;
            font-weight: 800;
        }

        .metric-card.in-progress .val { color: var(--primary); }
        .metric-card.delayed .val { color: var(--danger); }
        .metric-card.completed .val { color: var(--success); }

        /* نظام التبويبات */
        .nav-pills {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .pill-btn {
            flex: 1;
            background: #e2e8f0;
            border: none;
            padding: 12px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .pill-btn.active {
            background: var(--sidebar-bg);
            color: #ffffff;
            box-shadow: var(--shadow-sm);
        }

        /* الحاويات ونماذج الإدخال */
        .panel-box {
            background: var(--card-bg);
            padding: 28px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            margin-bottom: 24px;
        }

        .panel-box h3 {
            margin-top: 0;
            font-size: 16px;
            color: var(--sidebar-bg);
            border-bottom: 2px solid var(--bg-body);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-item {
            margin-bottom: 16px;
        }

        .form-item.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: #fff;
            color: var(--text-main);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* الأزرار الاحترافية */
        .actions-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 11px 20px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            transition: background 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .btn:hover { background: var(--primary-hover); }
        .btn-alt { background: #64748b; }
        .btn-alt:hover { background: #475569; }
        .btn-pdf { background: #0284c7; }
        .btn-pdf:hover { background: #0369a1; }
        
        .btn-edit-item { background: var(--warning); padding: 5px 12px; font-size: 12px; border-radius: 6px; color: #fff; border:none; cursor:pointer;}
        .btn-del-item { background: var(--danger); padding: 5px 12px; font-size: 12px; border-radius: 6px; color: #fff; border:none; cursor:pointer;}

        /* شريط البحث المتقدم */
        .search-box-wrapper {
            margin-bottom: 24px;
        }

        /* بطاقات المعاملات الفردية */
        .record-item-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            border-right: 5px solid var(--primary);
            position: relative;
        }

        .record-item-card.state-delayed { border-right-color: var(--danger); background-color: #fef2f2; }
        .record-item-card.state-completed { border-right-color: var(--success); background-color: #f0fdf4; }

        .record-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 8px;
        }

        .record-item-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--sidebar-bg);
        }

        .status-tag {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .tag-green { background: #dcfce7; color: #166534; }
        .tag-red { background: #fee2e2; color: #991b1b; }
        .tag-orange { background: #ffedd5; color: #9a3412; }

        .record-item-details {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.8;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .record-item-details strong {
            color: var(--text-main);
        }

        .record-item-footer {
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .restricted-admin { display: none; }

        @media print {
            body { background: #fff; padding: 0; }
            .no-print-zone { display: none !important; }
            .print-zone { display: block !important; }
            .record-item-card { border: 1px solid #ccc !important; break-inside: avoid; }
        }
        .print-zone { display: none; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- رأس الصفحة -->
    <div class="top-navbar no-print-zone">
        <h1 class="brand-title">نظام إدارة ومتابعة المعاملات</h1>
        <button class="auth-trigger" id="authToggleBtn" onclick="toggleAuth()">🔒 تسجيل الدخول</button>
    </div>

    <!-- لوحة المؤشرات -->
    <div class="metrics-grid no-print-zone">
        <div class="metric-card in-progress">
            <div class="label">تحت الإجراء</div>
            <div class="val" id="countInProgress">0</div>
        </div>
        <div class="metric-card delayed">
            <div class="label">متأخرة</div>
            <div class="val" id="countDelayed">0</div>
        </div>
        <div class="metric-card completed">
            <div class="label">المنجزة</div>
            <div class="val" id="countCompleted">0</div>
        </div>
    </div>

    <!-- التبويبات -->
    <div class="nav-pills no-print-zone">
        <button class="pill-btn active" id="tabActive" onclick="switchTab('active')">المعاملات النشطة والمتأخرة</button>
        <button class="pill-btn" id="tabCompleted" onclick="switchTab('completed')">المعاملات المنجزة</button>
    </div>

    <!-- نموذج الادخال المخصص للأدمن -->
    <div class="panel-box restricted-admin no-print-zone" id="adminFormCard">
        <h3 id="formTitleText">➕ تسجيل معاملة جديدة</h3>
        <input type="hidden" id="recordId">
        
        <div class="form-grid-2">
            <div class="form-item">
                <label>رقم المعاملة:</label>
                <input type="text" id="transNumber" placeholder="أدخل رقم المعاملة">
            </div>
            <div class="form-item">
                <label>تاريخ المعاملة:</label>
                <input type="date" id="transDate">
            </div>
        </div>

        <div class="form-item full-width">
            <label>موضوع المعاملة:</label>
            <input type="text" id="transSubject" placeholder="أدخل موضوع المعاملة بالتفصيل">
        </div>

        <div class="form-grid-2">
            <div class="form-item">
                <label>صادرة من:</label>
                <input type="text" id="transFrom" placeholder="الجهة المصدرة">
            </div>
            <div class="form-item">
                <label>حولت لـ:</label>
                <input type="text" id="transTo" placeholder="الجهة المحولة لها">
            </div>
        </div>

        <div class="form-grid-2">
            <div class="form-item">
                <label>الوحدة:</label>
                <select id="transUnit">
                    <option value="العموم">العموم</option>
                    <option value="الادارية">الادارية</option>
                    <option value="العمليات">العمليات</option>
                    <option value="التموين">التموين</option>
                    <option value="الاولى">الاولى</option>
                    <option value="الثانية">الثانية</option>
                    <option value="الاسناد">الاسناد</option>
                </select>
            </div>
            <div class="form-item">
                <label>الحالة:</label>
                <select id="transStatus">
                    <option value="لم تنجز">لم تنجز</option>
                    <option value="أنجزت">أنجزت</option>
                </select>
            </div>
        </div>

        <div class="form-item full-width">
            <label>تاريخ الاستحقاق / الانتهاء:</label>
            <input type="date" id="transDueDate">
        </div>

        <div class="actions-group">
            <button class="btn" onclick="saveRecord()" id="saveBtnText">حفظ المعاملة</button>
            <button class="btn btn-alt" onclick="resetForm()">إلغاء</button>
            <button class="btn btn-pdf" onclick="exportDelayedPDF()">📄 تقرير المتأخرات PDF</button>
        </div>
    </div>

    <!-- البحث المتقدم -->
    <div class="search-box-wrapper no-print-zone">
        <input type="text" id="searchQuery" placeholder="🔍 بحث سريع (برقم المعاملة، الموضوع، الوحدة، الجهات...)" oninput="renderRecords()">
    </div>

    <!-- قائمة عرض المعاملات -->
    <div id="recordsList" class="no-print-zone"></div>

    <!-- مساحة مخصصة للطباعة وتصدير الـ PDF -->
    <div id="printArea" class="print-zone"></div>
</div>

<script>
    let isAdmin = false;
    let currentTab = 'active';

    // تعيين التواريخ الافتراضية
    document.getElementById('transDate').valueAsDate = new Date();
    let defDue = new Date();
    defDue.setDate(defDue.getDate() + 15);
    document.getElementById('transDueDate').valueAsDate = defDue;

    function toggleAuth() {
        if (!isAdmin) {
            let pass = prompt("الرجاء إدخال كلمة المرور:");
            if (pass === "Dd1616") {
                isAdmin = true;
                document.getElementById('authToggleBtn').innerText = "🔓 خروج الأدمن";
                document.querySelectorAll('.restricted-admin').forEach(el => el.style.display = 'block');
                renderRecords();
            } else if (pass !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        } else {
            isAdmin = false;
            document.getElementById('authToggleBtn').innerText = "🔒 تسجيل الدخول";
            document.querySelectorAll('.restricted-admin').forEach(el => el.style.display = 'none');
            resetForm();
            renderRecords();
        }
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabActive').classList.toggle('active', tab === 'active');
        document.getElementById('tabCompleted').classList.toggle('active', tab === 'completed');
        renderRecords();
    }

    function getRecords() {
        return JSON.parse(localStorage.getItem('persistent_transactions_v2') || '[]');
    }

    function saveRecord() {
        if (!isAdmin) return;
        let id = document.getElementById('recordId').value;
        let number = document.getElementById('transNumber').value.trim();
        let date = document.getElementById('transDate').value;
        let subject = document.getElementById('transSubject').value.trim();
        let from = document.getElementById('transFrom').value.trim();
        let to = document.getElementById('transTo').value.trim();
        let unit = document.getElementById('transUnit').value;
        let status = document.getElementById('transStatus').value;
        let dueDate = document.getElementById('transDueDate').value;

        if (!number || !subject || !date || !dueDate) {
            alert('الرجاء التأكد من تعبئة جميع الحقول الأساسية.');
            return;
        }

        let records = getRecords();

        if (id) {
            records = records.map(r => r.id == id ? { id: Number(id), number, date, subject, from, to, unit, status, dueDate } : r);
        } else {
            records.push({ id: Date.now(), number, date, subject, from, to, unit, status, dueDate });
        }

        localStorage.setItem('persistent_transactions_v2', JSON.stringify(records));
        resetForm();
        renderRecords();
    }

    function editRecord(id) {
        if (!isAdmin) return;
        let records = getRecords();
        let r = records.find(item => item.id == id);
        if (!r) return;

        document.getElementById('recordId').value = r.id;
        document.getElementById('transNumber').value = r.number;
        document.getElementById('transDate').value = r.date;
        document.getElementById('transSubject').value = r.subject;
        document.getElementById('transFrom').value = r.from || '';
        document.getElementById('transTo').value = r.to || '';
        document.getElementById('transUnit').value = r.unit || 'العموم';
        document.getElementById('transStatus').value = r.status;
        document.getElementById('transDueDate').value = r.dueDate;
        
        document.getElementById('formTitleText').innerText = "✏️ تعديل المعاملة";
        document.getElementById('saveBtnText').innerText = "تحديث البيانات";
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function deleteRecord(id) {
        if (!isAdmin) return;
        if (confirm('هل أنت متأكد من حذف هذه المعاملة نهائياً؟')) {
            let records = getRecords().filter(r => r.id !== id);
            localStorage.setItem('persistent_transactions_v2', JSON.stringify(records));
            renderRecords();
        }
    }

    function resetForm() {
        document.getElementById('recordId').value = '';
        document.getElementById('transNumber').value = '';
        document.getElementById('transSubject').value = '';
        document.getElementById('transFrom').value = '';
        document.getElementById('transTo').value = '';
        document.getElementById('transUnit').value = 'العموم';
        document.getElementById('transStatus').value = 'لم تنجز';
        document.getElementById('formTitleText').innerText = "➕ تسجيل معاملة جديدة";
        document.getElementById('saveBtnText').innerText = "حفظ المعاملة";
    }

    function exportDelayedPDF() {
        let records = getRecords();
        let today = new Date();
        today.setHours(0,0,0,0);

        let delayed = records.filter(r => {
            let dueD = new Date(r.dueDate);
            let diffDays = Math.ceil((dueD - today) / (1000 * 60 * 60 * 24));
            return diffDays < 0 && r.status === 'لم تنجز';
        });

        if (delayed.length === 0) {
            alert('لا توجد معاملات متأخرة حالياً لتصديرها.');
            return;
        }

        let printArea = document.getElementById('printArea');
        let printHTML = `
            <div style="direction: rtl; font-family: Tahoma, sans-serif; padding: 20px; color: #000;">
                <h2 style="text-align: center; color: #dc2626; font-size: 22px;">تقرير المعاملات المتأخرة</h2>
                <p style="text-align: center; color: #555; font-size: 13px;">تاريخ إصدار التقرير: ${new Date().toLocaleDateString('ar-SA')}</p>
                <hr style="border: 0; border-top: 1px solid #ccc; margin: 15px 0;">
        `;

        delayed.forEach((r, index) => {
            let dueD = new Date(r.dueDate);
            let diffDays = Math.abs(Math.ceil((dueD - today) / (1000 * 60 * 60 * 24)));
            printHTML += `
                <div style="border: 1px solid #dc2626; background: #fef2f2; padding: 10px 14px; margin-bottom: 10px; border-radius: 6px;">
                    <strong style="font-size: 15px;">${index + 1}. رقم المعاملة: ${r.number}</strong>
                    <div style="font-size: 13px; margin-top: 3px;"><strong>الموضوع:</strong> ${r.subject}</div>
                    <div style="font-size: 12px; color: #444; margin-top: 2px;"><strong>الوحدة:</strong> ${r.unit || '---'} &nbsp;|&nbsp; <strong>صادرة من:</strong> ${r.from || '---'} &nbsp;|&nbsp; <strong>حولت لـ:</strong> ${r.to || '---'}</div>
                    <div style="font-size: 13px; color: #991b1b; font-weight: bold; margin-top: 5px;">⚠️ متأخرة بمدّة: ${diffDays} يوم عن تاريخ الاستحقاق (${r.dueDate})</div>
                </div>
            `;
        });

        printHTML += `</div>`;
        printArea.innerHTML = printHTML;
        window.print();
        setTimeout(() => { printArea.innerHTML = ''; }, 1000);
    }

    function renderRecords() {
        let listContainer = document.getElementById('recordsList');
        let query = document.getElementById('searchQuery').value.toLowerCase();
        let records = getRecords();
        let today = new Date();
        today.setHours(0,0,0,0);

        listContainer.innerHTML = '';

        let inProgressCount = 0;
        let completedCount = 0;
        let delayedCount = 0;

        records.forEach(r => {
            let dueD = new Date(r.dueDate);
            let diffDays = Math.ceil((dueD - today) / (1000 * 60 * 60 * 24));
            if (diffDays < 0 && r.status === 'لم تنجز') {
                delayedCount++;
            } else if (r.status === 'أنجزت') {
                completedCount++;
            } else {
                inProgressCount++;
            }
        });

        document.getElementById('countInProgress').innerText = inProgressCount;
        document.getElementById('countDelayed').innerText = delayedCount;
        document.getElementById('countCompleted').innerText = completedCount;

        let filtered = records.filter(r => {
            if (currentTab === 'active') {
                return r.status !== 'أنجزت';
            } else {
                return r.status === 'أنجزت';
            }
        });

        filtered = filtered.filter(r => 
            r.number.toLowerCase().includes(query) || 
            r.subject.toLowerCase().includes(query) || 
            (r.unit && r.unit.toLowerCase().includes(query)) || 
            (r.from && r.from.toLowerCase().includes(query)) || 
            (r.to && r.to.toLowerCase().includes(query))
        );

        // --- ترتيب المعاملات تلقائياً تصاعدياً حسب تاريخ الاستحقاق (الأقرب أو المتأخرة أولاً) ---
        filtered.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));

        if (filtered.length === 0) {
            listContainer.innerHTML = '<p style="text-align:center; color:#64748b; padding: 25px; font-size: 14px; background: #fff; border-radius: var(--radius-md); border: 1px solid var(--border-light);">لا توجد معاملات مطابقة في هذا القسم</p>';
            return;
        }

        filtered.forEach(r => {
            let dueD = new Date(r.dueDate);
            let diffDays = Math.ceil((dueD - today) / (1000 * 60 * 60 * 24));

            let stateClass = '';
            let statusTag = '';
            let remainingLabel = '';

            if (r.status === 'أنجزت') {
                stateClass = 'state-completed';
                statusTag = `<span class="status-tag tag-green">✅ منجزة</span>`;
                remainingLabel = `مكتملة`;
            } else {
                if (diffDays < 0) {
                    stateClass = 'state-delayed';
                    statusTag = `<span class="status-tag tag-red">🔴 متأخرة</span>`;
                    remainingLabel = `متأخرة بـ ${Math.abs(diffDays)} يوم`;
                } else if (diffDays <= 5) {
                    statusTag = `<span class="status-tag tag-orange">🟠 قريبة الانتهاء</span>`;
                    remainingLabel = `متبقي ${diffDays} يوم`;
                } else {
                    statusTag = `<span class="status-tag tag-green">🟢 نشطة</span>`;
                    remainingLabel = `متبقي ${diffDays} يوم`;
                }
            }

            let cardDiv = document.createElement('div');
            cardDiv.className = `record-item-card ${stateClass}`;
            cardDiv.innerHTML = `
                <div class="record-item-header">
                    <span class="record-item-title">📁 المعاملة رقم: ${r.number}</span>
                    <span>${statusTag}</span>
                </div>
                <div class="record-item-details">
                    <div><strong>الموضوع:</strong> ${r.subject}</div>
                    <div><strong>الوحدة:</strong> ${r.unit || '---'}</div>
                    <div><strong>تاريخ المعاملة:</strong> ${r.date}</div>
                    <div><strong>تاريخ الاستحقاق:</strong> ${r.dueDate}</div>
                    <div><strong>صادرة من:</strong> ${r.from || '---'}</div>
                    <div><strong>حولت لـ:</strong> ${r.to || '---'}</div>
                    <div style="grid-column: span 2; margin-top: 2px;"><strong>المدة المتبقية:</strong> ${remainingLabel}</div>
                </div>
                <div style="display: ${isAdmin ? 'block' : 'none'};">
                    <div class="record-item-footer">
                        <button class="btn-edit-item" onclick="editRecord(${r.id})">✏️ تعديل</button>
                        <button class="btn-del-item" onclick="deleteRecord(${r.id})">🗑️ حذف</button>
                    </div>
                </div>
            `;
            listContainer.appendChild(cardDiv);
        });
    }

    renderRecords();
</script>

</body>
</html>
