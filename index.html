<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة المعاملات</title>
    <!-- استيراد مكتبات Firebase (SDK الإصدار 10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC4tcL7HF_eWO2r7JH3D8ptnyTuwk0vSlw",
          authDomain: "project-3958113961260211077.firebaseapp.com",
          projectId: "project-3958113961260211077",
          storageBucket: "project-3958113961260211077.firebasestorage.app",
          messagingSenderId: "889377835896",
          appId: "1:889377835896:web:bbbb74e99b3585c9d8168d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.doc = doc;

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof loadRecordsFromCloud === 'function') {
                loadRecordsFromCloud();
            }
        });
    </script>

    <style>
        :root {
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --bg-body: #090d16;
            --sidebar-bg: #111827;
            --card-bg: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #374151;
            --radius: 12px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            direction: rtl;
        }

        .dashboard-container { max-width: 1300px; margin: 0 auto; }

        .top-navbar {
            background: var(--sidebar-bg);
            color: #ffffff;
            padding: 16px 24px;
            border-radius: var(--radius);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .navbar-brand-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            user-select: none;
        }

        .infographic-icon {
            width: 38px;
            height: 38px;
            filter: drop-shadow(0 2px 6px rgba(59, 130, 246, 0.4));
            transition: transform 0.3s ease;
        }

        .navbar-brand-wrapper:hover .infographic-icon {
            transform: scale(1.08) rotate(3deg);
        }

        /* عنوان قابل للنقر المزدوج الخفي للإدارة */
        .brand-title { 
            margin: 0; 
            font-size: 19px; 
            font-weight: 800; 
            background: linear-gradient(to left, #60a5fa, #38bdf8); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: var(--sidebar-bg);
            padding: 18px 22px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .metric-card:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.2); }
        .metric-card.active-filter { border-color: var(--primary); background: rgba(59, 130, 246, 0.1); box-shadow: 0 0 0 2px rgba(59,130,246,0.3); }

        .metric-card .label { font-size: 13px; color: var(--text-muted); font-weight: 600; }
        .metric-card .val { font-size: 24px; font-weight: 900; }
        .metric-card.in-progress .val { color: #60a5fa; }
        .metric-card.delayed .val { color: #f87171; }
        .metric-card.completed .val { color: #34d399; }

        .nav-pills { display: flex; gap: 10px; margin-bottom: 20px; }

        .pill-btn {
            flex: 1;
            background: var(--sidebar-bg);
            border: 1px solid var(--border);
            padding: 11px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            text-align: center;
            transition: all 0.25s ease;
        }

        .pill-btn:hover { background: #374151; color: #fff; }
        .pill-btn.active { background: var(--primary); border-color: var(--primary); color: #ffffff; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }

        .panel-box {
            background: var(--sidebar-bg);
            padding: 24px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel-box h3 {
            margin-top: 0;
            font-size: 15px;
            color: #ffffff;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 16px;
        }

        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-item { margin-bottom: 14px; }
        .form-item.full-width { grid-column: span 2; }

        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 12px; color: var(--text-muted); }

        input, select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            background: #0f172a;
            color: var(--text-main);
            text-align: right;
            transition: all 0.2s;
        }

        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }

        .actions-group { display: flex; gap: 10px; margin-top: 16px; }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            transition: all 0.2s ease;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
        .btn-alt { background: #4b5563; }
        .btn-pdf { background: #0284c7; }

        .search-box-wrapper { margin-bottom: 20px; display: flex; gap: 12px; align-items: center; }
        .search-box-wrapper input { padding: 12px 18px; border-radius: var(--radius); border: 1px solid var(--border); font-size: 13px; background: var(--sidebar-bg); }
        
        .reset-filter-btn {
            background: var(--sidebar-bg);
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .reset-filter-btn:hover { background: #374151; color: #fff; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .transaction-card {
            background: var(--sidebar-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: cardFadeIn 0.4s ease-out forwards;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .transaction-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.4);
        }

        @keyframes pulseBorder {
            0% { border-color: rgba(239, 68, 68, 0.4); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            50% { border-color: rgba(239, 68, 68, 1); box-shadow: 0 0 15px 3px rgba(239, 68, 68, 0.5); }
            100% { border-color: rgba(239, 68, 68, 0.4); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
        }

        .transaction-card.card-delayed {
            background: linear-gradient(135deg, var(--sidebar-bg), rgba(239, 68, 68, 0.08));
            animation: pulseBorder 2s infinite ease-in-out, cardFadeIn 0.4s ease-out forwards;
        }

        @keyframes pulseYellowBorder {
            0% { border-color: rgba(245, 158, 11, 0.4); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            50% { border-color: rgba(245, 158, 11, 1); box-shadow: 0 0 15px 3px rgba(245, 158, 11, 0.5); }
            100% { border-color: rgba(245, 158, 11, 0.4); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
        }

        .transaction-card.card-approaching {
            background: linear-gradient(135deg, var(--sidebar-bg), rgba(245, 158, 11, 0.08));
            animation: pulseYellowBorder 2s infinite ease-in-out, cardFadeIn 0.4s ease-out forwards;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .trans-number-date-group { display: flex; flex-direction: column; gap: 2px; }
        .trans-number { font-weight: 800; font-size: 15px; color: #60a5fa; }
        .trans-date { font-size: 11.5px; color: var(--text-muted); font-weight: 600; }
        
        .card-body { margin-bottom: 14px; }
        .card-subject { font-size: 14px; font-weight: 700; color: #f3f4f6; margin-bottom: 8px; line-height: 1.5; }
        .card-meta { font-size: 12.5px; color: var(--text-muted); display: flex; justify-content: space-between; }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(55, 65, 81, 0.5);
            padding-top: 12px;
        }

        .status-badge { padding: 5px 10px; border-radius: 6px; font-size: 11.5px; font-weight: 700; display: inline-block; }
        .badge-green { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-red { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-orange { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

        .table-actions { display: flex; gap: 8px; }
        .btn-mini { padding: 6px 12px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; transition: transform 0.2s; }
        .btn-mini:hover { transform: scale(1.08); }
        .btn-mini-edit { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .btn-mini-del { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .restricted-admin { display: none; }

        @media print {
            body { background: #fff; color: #000; padding: 0; }
            .no-print-zone { display: none !important; }
            .print-zone { display: block !important; }
        }
        .print-zone { display: none; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="top-navbar no-print-zone">
        <!-- النقر المزدوج (DoubleClick) هنا يفتح لوحة الإدارة سراً -->
        <div class="navbar-brand-wrapper" ondblclick="toggleAuth()" title="النظام يعمل بكفاءة">
            <svg class="infographic-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 16V8C21 6.89543 20.1046 6 19 6H5C3.89543 6 3 6.89543 3 8V16C3 17.1046 3.89543 18 5 18H19C20.1046 18 21 17.1046 21 16Z" stroke="#3b82f6" stroke-width="2" stroke-linejoin="round"/>
                <path d="M7 10H11" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
                <path d="M7 14H15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
                <circle cx="17" cy="10" r="1.5" fill="#34d399"/>
            </svg>
            <h1 class="brand-title">متابعة المعاملات</h1>
        </div>
    </div>

    <div class="metrics-grid no-print-zone">
        <div class="metric-card in-progress" id="cardInProgress" onclick="filterByMetric('in-progress')">
            <div class="label">تحت الإجراء</div>
            <div class="val" id="countInProgress">0</div>
        </div>
        <div class="metric-card delayed" id="cardDelayed" onclick="filterByMetric('delayed')">
            <div class="label">متأخرة</div>
            <div class="val" id="countDelayed">0</div>
        </div>
        <div class="metric-card completed" id="cardCompleted" onclick="filterByMetric('completed')">
            <div class="label">المنجزة</div>
            <div class="val" id="countCompleted">0</div>
        </div>
    </div>

    <div class="nav-pills no-print-zone">
        <button class="pill-btn active" id="tabActive" onclick="switchTab('active')">المعاملات النشطة والمتأخرة</button>
        <button class="pill-btn" id="tabCompleted" onclick="switchTab('completed')">المعاملات المنجزة</button>
    </div>

    <div class="panel-box restricted-admin no-print-zone" id="adminFormCard">
        <h3 id="formTitleText">➕ تسجيل معاملة جديدة</h3>
        <input type="hidden" id="recordId">
        
        <div class="form-grid-2">
            <div class="form-item">
                <label>رقم المعاملة:</label>
                <input type="text" id="transNumber" placeholder="رقم المعاملة">
            </div>
            <div class="form-item">
                <label>الحالة:</label>
                <select id="transStatus">
                    <option value="لم تنجز">لم تنجز</option>
                    <option value="أنجزت">أنجزت</option>
                </select>
            </div>
        </div>

        <div class="form-item full-width">
            <label>موضوع المعاملة:</label>
            <input type="text" id="transSubject" placeholder="موضوع المعاملة بالتفصيل">
        </div>

        <div class="form-grid-2">
            <div class="form-item">
                <label>حولت لـ:</label>
                <input type="text" id="transTo" placeholder="الجهة المحولة لها">
            </div>
            <div class="form-item">
                <label>تاريخ الإنجاز (هجري YYYY-MM-DD):</label>
                <input type="text" id="transDueDate" placeholder="1448-07-01">
            </div>
        </div>

        <div class="form-item full-width">
            <label>تاريخ المعاملة (هجري YYYY-MM-DD):</label>
            <input type="text" id="transDate" placeholder="1447-04-01">
        </div>

        <div class="actions-group">
            <button class="btn" onclick="saveRecord()" id="saveBtnText">حفظ المعاملة</button>
            <button class="btn btn-alt" onclick="resetForm()">إلغاء</button>
            <button class="btn btn-pdf" onclick="exportDelayedPDF()">📄 تقرير المتأخرات PDF</button>
        </div>
    </div>

    <div class="search-box-wrapper no-print-zone">
        <input type="text" id="searchQuery" placeholder="🔍 بحث فوري تفاعلي (برقم المعاملة، الموضوع، الجهة المحولة...)" oninput="renderRecords()">
        <button class="reset-filter-btn" onclick="clearMetricFilter()" id="resetFilterBtn" style="display:none;">إلغاء الفلتر ✖</button>
    </div>

    <div class="cards-grid no-print-zone" id="recordsCardsContainer"></div>

    <div id="printArea" class="print-zone"></div>
</div>

<script>
    let isAdmin = false;
    let currentTab = 'active';
    let activeMetricFilter = null;
    let cachedRecords = []; 

    function getTodayHijriString() {
        try {
            let formatter = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
            let parts = formatter.formatToParts(new Date());
            let y = parts.find(p => p.type === 'year').value;
            let m = parts.find(p => p.type === 'month').value;
            let d = parts.find(p => p.type === 'day').value;
            return `${y}-${m}-${d}`;
        } catch (e) {
            return "1447-04-01";
        }
    }

    function parseHijriToDate(hijriStr) {
        if (!hijriStr) return new Date();
        let parts = hijriStr.split(/[-/]/);
        if (parts.length !== 3) return new Date();
        let hy = parseInt(parts[0], 10);
        let hm = parseInt(parts[1], 10);
        let hd = parseInt(parts[2], 10);

        let estimatedGregorianYear = Math.round(hy * 0.9702 + 621.56);
        let d = new Date(estimatedGregorianYear, hm - 1, hd);
        return d;
    }

    document.getElementById('transDate').value = getTodayHijriString();
    document.getElementById('transDueDate').value = "1448-07-01";

    function animateValue(id, start, end, duration) {
        let obj = document.getElementById(id);
        if (!obj) return;
        if (start === end) {
            obj.innerText = end;
            return;
        }
        let range = end - start;
        let current = start;
        let increment = end > start ? 1 : -1;
        let stepTime = Math.abs(Math.floor(duration / range));
        stepTime = Math.max(stepTime, 20);
        let timer = setInterval(function() {
            current += increment;
            obj.innerText = current;
            if (current == end) {
                clearInterval(timer);
            }
        }, stepTime);
    }

    function toggleAuth() {
        if (!isAdmin) {
            let pass = prompt("الرجاء إدخال كلمة المرور:");
            if (pass !== null) {
                if (pass.trim() === "Dd1616") {
                    isAdmin = true;
                    document.querySelectorAll('.restricted-admin').forEach(el => {
                        el.style.display = el.tagName === 'DIV' && el.id === 'adminFormCard' ? 'block' : 'flex';
                    });
                    renderRecords();
                } else {
                    alert("كلمة المرور غير صحيحة!");
                }
            }
        } else {
            isAdmin = false;
            document.querySelectorAll('.restricted-admin').forEach(el => el.style.display = 'none');
            resetForm();
            renderRecords();
        }
    }

    function switchTab(tab) {
        currentTab = tab;
        activeMetricFilter = null;
        document.getElementById('resetFilterBtn').style.display = 'none';
        document.querySelectorAll('.metric-card').forEach(c => c.classList.remove('active-filter'));

        document.getElementById('tabActive').classList.toggle('active', tab === 'active');
        document.getElementById('tabCompleted').classList.toggle('active', tab === 'completed');
        renderRecords();
    }

    function filterByMetric(metricType) {
        activeMetricFilter = activeMetricFilter === metricType ? null : metricType;
        
        document.querySelectorAll('.metric-card').forEach(c => c.classList.remove('active-filter'));
        if (activeMetricFilter) {
            document.getElementById('resetFilterBtn').style.display = 'block';
            if (metricType === 'in-progress') document.getElementById('cardInProgress').classList.add('active-filter');
            if (metricType === 'delayed') document.getElementById('cardDelayed').classList.add('active-filter');
            if (metricType === 'completed') document.getElementById('cardCompleted').classList.add('active-filter');
        } else {
            document.getElementById('resetFilterBtn').style.display = 'none';
        }
        renderRecords();
    }

    function clearMetricFilter() {
        activeMetricFilter = null;
        document.getElementById('resetFilterBtn').style.display = 'none';
        document.querySelectorAll('.metric-card').forEach(c => c.classList.remove('active-filter'));
        renderRecords();
    }

    async function loadRecordsFromCloud() {
        try {
            const querySnapshot = await window.getDocs(window.collection(window.db, "transactions"));
            cachedRecords = [];
            querySnapshot.forEach((docSnap) => {
                let data = docSnap.data();
                cachedRecords.push({
                    docId: docSnap.id,
                    id: data.id || Date.now(),
                    number: data.number,
                    date: data.date || getTodayHijriString(),
                    subject: data.subject,
                    to: data.to,
                    status: data.status,
                    dueDate: data.dueDate
                });
            });
            renderRecords();
        } catch (error) {
            console.error("خطأ في جلب البيانات:", error);
        }
    }

    async function saveRecord() {
        if (!isAdmin) return;
        let docId = document.getElementById('recordId').value;
        let number = document.getElementById('transNumber').value.trim();
        let date = document.getElementById('transDate').value.trim();
        let subject = document.getElementById('transSubject').value.trim();
        let to = document.getElementById('transTo').value.trim();
        let status = document.getElementById('transStatus').value;
        let dueDate = document.getElementById('transDueDate').value.trim();

        if (!number || !subject || !dueDate || !date) {
            alert('الرجاء التأكد من تعبئة جميع الحقول الأساسية وتواريخ المعاملة.');
            return;
        }

        let recordData = {
            id: Date.now(),
            number,
            date,
            subject,
            to,
            status,
            dueDate
        };

        try {
            if (docId) {
                let targetDoc = cachedRecords.find(r => r.id == docId);
                if (targetDoc) {
                    recordData.id = Number(docId);
                    await window.updateDoc(window.doc(window.db, "transactions", targetDoc.docId), recordData);
                }
            } else {
                await window.addDoc(window.collection(window.db, "transactions"), recordData);
            }

            resetForm();
            loadRecordsFromCloud();
        } catch (error) {
            alert("حدث خطأ أثناء حفظ المعاملة: " + error.message);
        }
    }

    function editRecord(id) {
        if (!isAdmin) return;
        let r = cachedRecords.find(item => item.id == id);
        if (!r) return;

        document.getElementById('recordId').value = r.id;
        document.getElementById('transNumber').value = r.number;
        document.getElementById('transDate').value = r.date || getTodayHijriString();
        document.getElementById('transSubject').value = r.subject;
        document.getElementById('transTo').value = r.to || '';
        document.getElementById('transStatus').value = r.status;
        document.getElementById('transDueDate').value = r.dueDate;
        
        document.getElementById('formTitleText').innerText = "✏️ تعديل المعاملة";
        document.getElementById('saveBtnText').innerText = "تحديث البيانات";
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    async function deleteRecord(id) {
        if (!isAdmin) return;
        if (confirm('هل أنت متأكد من حذف هذه المعاملة؟')) {
            let r = cachedRecords.find(item => item.id == id);
            if (r && r.docId) {
                try {
                    await window.deleteDoc(window.doc(window.db, "transactions", r.docId));
                    loadRecordsFromCloud();
                } catch (error) {
                    alert("تعذر الحذف: " + error.message);
                }
            }
        }
    }

    function resetForm() {
        document.getElementById('recordId').value = '';
        document.getElementById('transNumber').value = '';
        document.getElementById('transSubject').value = '';
        document.getElementById('transTo').value = '';
        document.getElementById('transStatus').value = 'لم تنجز';
        document.getElementById('transDate').value = getTodayHijriString();
        document.getElementById('transDueDate').value = "1448-07-01";
        document.getElementById('formTitleText').innerText = "➕ تسجيل معاملة جديدة";
        document.getElementById('saveBtnText').innerText = "حفظ المعاملة";
    }

    function exportDelayedPDF() {
        let todayDate = parseHijriToDate(getTodayHijriString());
        todayDate.setHours(0,0,0,0);

        let delayed = cachedRecords.filter(r => {
            let dueD = parseHijriToDate(r.dueDate);
            dueD.setHours(0,0,0,0);
            let diffDays = Math.round((dueD - todayDate) / (1000 * 60 * 60 * 24));
            return diffDays < 0 && r.status === 'لم تنجز';
        });

        if (delayed.length === 0) {
            alert('لا توجد معاملات متأخرة حالياً.');
            return;
        }

        let printArea = document.getElementById('printArea');
        let printHTML = `<div style="direction: rtl; font-family: Tahoma; padding: 20px;"><h2>تقرير المعاملات المتأخرة</h2><hr>`;
        delayed.forEach((r, index) => {
            let dueD = parseHijriToDate(r.dueDate);
            dueD.setHours(0,0,0,0);
            let diffDays = Math.abs(Math.round((dueD - todayDate) / (1000 * 60 * 60 * 24)));
            printHTML += `<p><b>${index+1}. معاملة رقم: ${r.number}</b> (تاريخها: ${r.date || '---'})<br>الموضوع: ${r.subject}<br>تاريخ الإنجاز الهجري: ${r.dueDate}<br>متأخرة بـ ${diffDays} يوم</p><hr>`;
        });
        printHTML += `</div>`;
        printArea.innerHTML = printHTML;
        window.print();
        setTimeout(() => { printArea.innerHTML = ''; }, 1000);
    }

    function renderRecords() {
        let query = document.getElementById('searchQuery').value.toLowerCase();
        let todayDate = parseHijriToDate(getTodayHijriString());
        todayDate.setHours(0,0,0,0);

        let inProgressCount = 0;
        let completedCount = 0;
        let delayedCount = 0;

        cachedRecords.forEach(r => {
            let dueD = parseHijriToDate(r.dueDate);
            dueD.setHours(0,0,0,0);
            let diffDays = Math.round((dueD - todayDate) / (1000 * 60 * 60 * 24));
            if (diffDays < 0 && r.status === 'لم تنجز') {
                delayedCount++;
            } else if (r.status === 'أنجزت') {
                completedCount++;
            } else {
                inProgressCount++;
            }
        });

        let oldInProgress = parseInt(document.getElementById('countInProgress').innerText) || 0;
        let oldDelayed = parseInt(document.getElementById('countDelayed').innerText) || 0;
        let oldCompleted = parseInt(document.getElementById('countCompleted').innerText) || 0;

        animateValue('countInProgress', oldInProgress, inProgressCount, 400);
        animateValue('countDelayed', oldDelayed, delayedCount, 400);
        animateValue('countCompleted', oldCompleted, completedCount, 400);

        let filtered = cachedRecords.filter(r => {
            let dueD = parseHijriToDate(r.dueDate);
            dueD.setHours(0,0,0,0);
            let diffDays = Math.round((dueD - todayDate) / (1000 * 60 * 60 * 24));
            let isDelayed = diffDays < 0 && r.status === 'لم تنجز';
            let isCompleted = r.status === 'أنجزت';
            let isInProgress = !isDelayed && !isCompleted;

            if (activeMetricFilter === 'in-progress' && !isInProgress) return false;
            if (activeMetricFilter === 'delayed' && !isDelayed) return false;
            if (activeMetricFilter === 'completed' && !isCompleted) return false;

            if (!activeMetricFilter) {
                if (currentTab === 'active' && isCompleted) return false;
                if (currentTab === 'completed' && !isCompleted) return false;
            }

            return true;
        });
        
        filtered = filtered.filter(r => 
            r.number.toLowerCase().includes(query) || 
            r.subject.toLowerCase().includes(query) || 
            (r.to && r.to.toLowerCase().includes(query)) ||
            (r.date && r.date.toLowerCase().includes(query))
        );

        filtered.sort((a, b) => parseHijriToDate(a.dueDate) - parseHijriToDate(b.dueDate));

        let container = document.getElementById('recordsCardsContainer');
        container.innerHTML = '';

        if (filtered.length === 0) {
            container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px; background: var(--sidebar-bg); border-radius: var(--radius); border: 1px solid var(--border);">لا توجد سجلات مطابقة للعرض</div>`;
            return;
        }

        filtered.forEach(r => {
            let dueD = parseHijriToDate(r.dueDate);
            dueD.setHours(0,0,0,0);
            let diffDays = Math.round((dueD - todayDate) / (1000 * 60 * 60 * 24));

            let cardClass = '';
            let statusBadge = '';

            if (r.status === 'أنجزت') {
                statusBadge = `<span class="status-badge badge-green">منجزة</span>`;
            } else if (diffDays < 0) {
                cardClass = 'card-delayed';
                statusBadge = `<span class="status-badge badge-red">متأخرة (${Math.abs(diffDays)} يوم)</span>`;
            } else if (diffDays <= 4) {
                cardClass = 'card-approaching';
                statusBadge = `<span class="status-badge badge-orange">متبقي ${diffDays} يوم (قريب)</span>`;
            } else {
                statusBadge = `<span class="status-badge badge-green">متبقي ${diffDays} يوم</span>`;
            }

            let card = document.createElement('div');
            card.className = `transaction-card ${cardClass}`;
            card.innerHTML = `
                <div class="card-header">
                    <div class="trans-number-date-group">
                        <span class="trans-number"># ${r.number}</span>
                        <span class="trans-date">📅 ${r.date || 'غير محددة'}</span>
                    </div>
                    ${statusBadge}
                </div>
                <div class="card-body">
                    <div class="card-subject">${r.subject}</div>
                    <div class="card-meta">
                        <span>الجهة: <b>${r.to || '---'}</b></span>
                        <span>الإنجاز: ${r.dueDate}</span>
                    </div>
                </div>
                <div class="card-footer restricted-admin" style="display: ${isAdmin ? 'flex' : 'none'};">
                    <span style="font-size: 11px; color: var(--text-muted);">إدارة السجل</span>
                    <div class="table-actions">
                        <button class="btn-mini btn-mini-edit" onclick="editRecord(${r.id})">تعديل</button>
                        <button class="btn-mini btn-mini-del" onclick="deleteRecord(${r.id})">حذف</button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }
</script>

</body>
</html>
