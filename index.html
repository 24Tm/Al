<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة المعاملات</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --sidebar-bg: #0f172a;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            direction: rtl;
        }

        .wrapper {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* رأس الصفحة الاحترافي */
        .header-bar {
            background: var(--sidebar-bg);
            color: #fff;
            padding: 20px 24px;
            border-radius: var(--radius);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.1);
            margin-bottom: 24px;
        }

        .header-bar h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .auth-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .auth-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* لوحة الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: var(--card-bg);
            padding: 18px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-box .title {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-box .value {
            font-size: 28px;
            font-weight: 800;
        }

        .stat-box.progress .value { color: var(--primary); }
        .stat-box.delayed .value { color: var(--danger); }
        .stat-box.completed .value { color: var(--success); }

        /* التبويبات */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .tab-item {
            flex: 1;
            background: #e2e8f0;
            border: none;
            padding: 14px;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-item.active {
            background: var(--sidebar-bg);
            color: #fff;
            box-shadow: var(--shadow);
        }

        /* بطاقة النماذج والإدخال */
        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .card h3 {
            margin-top: 0;
            font-size: 18px;
            color: var(--sidebar-bg);
            border-bottom: 2px solid var(--bg-main);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            background: #fff;
            color: var(--text-main);
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* الأزرار */
        .btn-container {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            transition: background 0.2s;
            box-shadow: var(--shadow);
        }

        .btn:hover { background: var(--primary-dark); }
        .btn-secondary { background: #64748b; }
        .btn-pdf { background: #0284c7; }
        .btn-edit { background: var(--warning); padding: 6px 12px; font-size: 13px; border-radius: 6px; }
        .btn-delete { background: var(--danger); padding: 6px 12px; font-size: 13px; border-radius: 6px; }

        /* شريط البحث */
        .search-container {
            margin-bottom: 24px;
        }

        /* قائمة المعاملات */
        .record-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            position: relative;
            border-right: 5px solid var(--primary);
        }

        .record-card.status-delayed { border-right-color: var(--danger); background: #fef2f2; }
        .record-card.status-completed { border-right-color: var(--success); background: #f0fdf4; }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .record-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--sidebar-bg);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .badge-green { background: #dcfce7; color: #166534; }
        .badge-red { background: #fee2e2; color: #991b1b; }
        .badge-orange { background: #ffedd5; color: #9a3412; }

        .record-body {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.8;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .record-body div strong {
            color: var(--text-main);
        }

        .record-footer {
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .admin-only { display: none; }

        @media print {
            body { background: #fff; padding: 0; }
            .no-print { display: none !important; }
            .print-container { display: block !important; }
            .record-card { border: 1px solid #ccc !important; break-inside: avoid; }
        }
        .print-container { display: none; }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- رأس الصفحة -->
    <div class="header-bar no-print">
        <h2>متابعة المعاملات</h2>
        <button class="auth-btn" id="authToggleBtn" onclick="toggleAuth()">🔒 تسجيل الدخول</button>
    </div>

    <!-- لوحة الإحصائيات -->
    <div class="stats-grid no-print">
        <div class="stat-box progress">
            <div class="title">تحت الإجراء</div>
            <div class="value" id="countInProgress">0</div>
        </div>
        <div class="stat-box delayed">
            <div class="title">متأخرة</div>
            <div class="value" id="countDelayed">0</div>
        </div>
        <div class="stat-box completed">
            <div class="title">المنجزة</div>
            <div class="value" id="countCompleted">0</div>
        </div>
    </div>

    <!-- التبويبات -->
    <div class="nav-tabs no-print">
        <button class="tab-item active" id="tabActive" onclick="switchTab('active')">المعاملات النشطة والمتأخرة</button>
        <button class="tab-item" id="tabCompleted" onclick="switchTab('completed')">المعاملات المنجزة</button>
    </div>

    <!-- نموذج الإدخال (للأدمن) -->
    <div class="card admin-only no-print" id="adminFormCard">
        <h3 id="formTitle">➕ إضافة معاملة جديدة</h3>
        <input type="hidden" id="recordId">
        
        <div class="form-row">
            <div class="form-group">
                <label>رقم المعاملة:</label>
                <input type="text" id="transNumber" placeholder="أدخل رقم المعاملة">
            </div>
            <div class="form-group">
                <label>تاريخ المعاملة (هجري / ميلادي):</label>
                <input type="date" id="transDate">
            </div>
        </div>

        <div class="form-group full">
            <label>موضوع المعاملة:</label>
            <input type="text" id="transSubject" placeholder="أدخل موضوع المعاملة">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>صادرة من:</label>
                <input type="text" id="transFrom" placeholder="الجهة المصدرة">
            </div>
            <div class="form-group">
                <label>حولت لـ:</label>
                <input type="text" id="transTo" placeholder="الجهة المحولة لها">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>الوحدة:</label>
                <select id="transUnit">
                    <option value="العموم">العموم</option>
                    <option value="الادارية">الادارية</option>
                    <option value="العمليات">العمليات</option>
                    <option value="التموين">التموين</option>
                    <option value="الاولى">الاولى</option>
                    <option value="الثانية">الثانية</option>
                    <option value="الاسناد">الاسناد</option>
                </select>
            </div>
            <div class="form-group">
                <label>الحالة:</label>
                <select id="transStatus">
                    <option value="لم تنجز">لم تنجز</option>
                    <option value="أنجزت">أنجزت</option>
                </select>
            </div>
        </div>

        <div class="form-group full">
            <label>تاريخ الاستحقاق / الانتهاء:</label>
            <input type="date" id="transDueDate">
        </div>

        <div class="btn-container">
            <button class="btn" onclick="saveRecord()" id="saveBtnText">حفظ المعاملة</button>
            <button class="btn btn-secondary" onclick="resetForm()">إلغاء</button>
            <button class="btn btn-pdf" onclick="exportDelayedPDF()">📄 تقرير المتأخرات PDF</button>
        </div>
    </div>

    <!-- شريط البحث -->
    <div class="search-container no-print">
        <input type="text" id="searchQuery" placeholder="🔍 ابحث برقم المعاملة، الموضوع، الوحدة، أو الجهات..." oninput="renderRecords()">
    </div>

    <!-- قائمة المعاملات -->
    <div id="recordsList" class="no-print"></div>

    <!-- مساحة الطباعة -->
    <div id="printArea" class="print-container"></div>
</div>

<script>
    let isAdmin = false;
    let currentTab = 'active';

    document.getElementById('transDate').valueAsDate = new Date();
    let defDue = new Date();
    defDue.setDate(defDue.getDate() + 15);
    document.getElementById('transDueDate').valueAsDate = defDue;

    function toggleAuth() {
        if (!isAdmin) {
            let pass = prompt("الرجاء إدخال كلمة المرور:");
            if (pass === "Dd1616") {
                isAdmin = true;
                document.getElementById('authToggleBtn').innerText = "🔓 خروج الأدمن";
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                renderRecords();
            } else if (pass !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        } else {
            isAdmin = false;
            document.getElementById('authToggleBtn').innerText = "🔒 تسجيل الدخول";
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
            resetForm();
            renderRecords();
        }
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabActive').classList.toggle('active', tab === 'active');
        document.getElementById('tabCompleted').classList.toggle('active', tab === 'completed');
        renderRecords();
    }

    function getRecords() {
        return JSON.parse(localStorage.getItem('persistent_transactions_v2') || '[]');
    }

    function saveRecord() {
        if (!isAdmin) return;
        let id = document.getElementById('recordId').value;
        let number = document.getElementById('transNumber').value.trim();
        let date = document.getElementById('transDate').value;
        let subject = document.getElementById('transSubject').value.trim();
        let from = document.getElementById('transFrom').value.trim();
        let to = document.getElementById('transTo').value.trim();
        let unit = document.getElementById('transUnit').value;
        let status = document.getElementById('transStatus').value;
        let dueDate = document.getElementById('transDueDate').value;

        if (!number || !subject || !date || !dueDate) {
            alert('الرجاء إدخال الحقول الأساسية المطلوبة.');
            return;
        }

        let records = getRecords();

        if (id) {
            records = records.map(r => r.id == id ? { id: Number(id), number, date, subject, from, to, unit, status, dueDate } : r);
        } else {
            records.push({ id: Date.now(), number, date, subject, from, to, unit, status, dueDate });
        }

        localStorage.setItem('persistent_transactions_v2', JSON.stringify(records));
        resetForm();
        renderRecords();
    }

    function editRecord(id) {
        if (!isAdmin) return;
        let records = getRecords();
        let r = records.find(item => item.id == id);
        if (!r) return;

        document.getElementById('recordId').value = r.id;
        document.getElementById('transNumber').value = r.number;
        document.getElementById('transDate').value = r.date;
        document.getElementById('transSubject').value = r.subject;
        document.getElementById('transFrom').value = r.from || '';
        document.getElementById('transTo').value = r.to || '';
        document.getElementById('transUnit').value = r.unit || 'العموم';
        document.getElementById('transStatus').value = r.status;
        document.getElementById('transDueDate').value = r.dueDate;
        
        document.getElementById('formTitle').innerText = "✏️ تعديل المعاملة";
        document.getElementById('saveBtnText').innerText = "تحديث البيانات";
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function deleteRecord(id) {
        if (!isAdmin) return;
        if (confirm('هل أنت متأكد من حذف هذه المعاملة نهائياً؟')) {
            let records = getRecords().filter(r => r.id !== id);
            localStorage.setItem('persistent_transactions_v2', JSON.stringify(records));
            renderRecords();
        }
    }

    function resetForm() {
        document.getElementById('recordId').value = '';
        document.getElementById('transNumber').value = '';
        document.getElementById('transSubject').value = '';
        document.getElementById('transFrom').value = '';
        document.getElementById('transTo').value = '';
        document.getElementById('transUnit').value = 'العموم';
        document.getElementById('transStatus').value = 'لم تنجز';
        document.getElementById('formTitle').innerText = "➕ إضافة معاملة جديدة";
        document.getElementById('saveBtnText').innerText = "حفظ المعاملة";
    }

    function exportDelayedPDF() {
        let records = getRecords();
        let today = new Date();
        today.setHours(0,0,0,0);

        let delayed = records.filter(r => {
            let dueD = new Date(r.dueDate);
            let diffDays = Math.ceil((dueD - today) / (1000 * 60 * 60 * 24));
            return diffDays < 0 && r.status === 'لم تنجز';
        });

        if (delayed.length === 0) {
            alert('لا توجد معاملات متأخرة ولم تنجز لتصديرها.');
            return;
        }

        let printArea = document.getElementById('printArea');
        let printHTML = `
            <div style="direction: rtl; font-family: Tahoma, sans-serif; padding: 20px; color: #000;">
                <h2 style="text-align: center; color: #ef4444; font-size: 24px;">تقرير المعاملات المتأخرة</h2>
                <p style="text-align: center; color: #555; font-size: 14px;">تاريخ التقرير: ${new Date().toLocaleDateString('ar-SA')}</p>
                <hr style="border: 0; border-top: 2px solid #ccc; margin: 15px 0;">
        `;

        delayed.forEach((r, index) => {
            let dueD = new Date(r.dueDate);
            let diffDays = Math.abs(Math.ceil((dueD - today) / (1000 * 60 * 60 * 24)));
            printHTML += `
                <div style="border: 1px solid #ef4444; background: #fef2f2; padding: 12px; margin-bottom: 12px; border-radius: 6px;">
                    <strong style="font-size: 16px;">${index + 1}. رقم المعاملة: ${r.number}</strong>
                    <div style="font-size: 14px; margin-top: 4px;"><strong>الموضوع:</strong> ${r.subject}</div>
                    <div style="font-size: 13px; color: #444; margin-top: 3px;"><strong>الوحدة:</strong> ${r.unit || '---'} &nbsp;|&nbsp; <strong>من:</strong> ${r.from || '---'} &nbsp;|&nbsp; <strong>إلى:</strong> ${r.to || '---'}</div>
                    <div style="font-size: 14px; color: #991b1b; font-weight: bold; margin-top: 6px;">⚠️ متأخرة بمقدار: ${diffDays} يوم عن تاريخ الاستحقاق (${r.dueDate})</div>
                </div>
            `;
        });

        printHTML += `</div>`;
        printArea.innerHTML = printHTML;
        window.print();
        setTimeout(() => { printArea.innerHTML = ''; }, 1000);
    }

    function renderRecords() {
        let listContainer = document.getElementById('recordsList');
        let query = document.getElementById('searchQuery').value.toLowerCase();
        let records = getRecords();
        let today = new Date();
        today.setHours(0,0,0,0);

        listContainer.innerHTML = '';

        let inProgressCount = 0;
        let completedCount = 0;
        let delayedCount = 0;

        records.forEach(r => {
            let dueD = new Date(r.dueDate);
            let diffDays = Math.ceil((dueD - today) / (1000 * 60 * 60 * 24));
            if (diffDays < 0 && r.status === 'لم تنجز') {
                delayedCount++;
            } else if (r.status === 'أنجزت') {
                completedCount++;
            } else {
                inProgressCount++;
            }
        });

        document.getElementById('countInProgress').innerText = inProgressCount;
        document.getElementById('countDelayed').innerText = delayedCount;
        document.getElementById('countCompleted').innerText = completedCount;

        let filtered = records.filter(r => {
            if (currentTab === 'active') {
                return r.status !== 'أنجزت';
            } else {
                return r.status === 'أنجزت';
            }
        });

        filtered = filtered.filter(r => 
            r.number.toLowerCase().includes(query) || 
            r.subject.toLowerCase().includes(query) || 
            (r.unit && r.unit.toLowerCase().includes(query)) || 
            (r.from && r.from.toLowerCase().includes(query)) || 
            (r.to && r.to.toLowerCase().includes(query))
        );

        if (filtered.length === 0) {
            listContainer.innerHTML = '<p style="text-align:center; color:#64748b; padding: 30px; font-size: 15px; background: #fff; border-radius: var(--radius); border: 1px solid var(--border);">لا توجد معاملات مطابقة في هذا القسم</p>';
            return;
        }

        filtered.reverse().forEach(r => {
            let dueD = new Date(r.dueDate);
            let diffDays = Math.ceil((dueD - today) / (1000 * 60 * 60 * 24));

            let statusClass = '';
            let statusBadge = '';
            let remainingText = '';

            if (r.status === 'أنجزت') {
                statusClass = 'status-completed';
                statusBadge = `<span class="badge badge-green">✅ منجزة</span>`;
                remainingText = `تمت بنجاح`;
            } else {
                if (diffDays < 0) {
                    statusClass = 'status-delayed';
                    statusBadge = `<span class="badge badge-red">🔴 متأخرة</span>`;
                    remainingText = `متأخرة بـ ${Math.abs(diffDays)} يوم`;
                } else if (diffDays <= 5) {
                    statusBadge = `<span class="badge badge-orange">🟠 تنتهي قريبًا</span>`;
                    remainingText = `متبقي ${diffDays} يوم`;
                } else {
                    statusBadge = `<span class="badge badge-green">🟢 نشطة</span>`;
                    remainingText = `متبقي ${diffDays} يوم`;
                }
            }

            let div = document.createElement('div');
            div.className = `record-card ${statusClass}`;
            div.innerHTML = `
                <div class="record-header">
                    <span class="record-title">📁 المعاملة رقم: ${r.number}</span>
                    <span>${statusBadge}</span>
                </div>
                <div class="record-body">
                    <div><strong>الموضوع:</strong> ${r.subject}</div>
                    <div><strong>الوحدة:</strong> ${r.unit || '---'}</div>
                    <div><strong>تاريخ المعاملة:</strong> ${r.date}</div>
                    <div><strong>تاريخ الاستحقاق:</strong> ${r.dueDate}</div>
                    <div><strong>صادرة من:</strong> ${r.from || '---'}</div>
                    <div><strong>حولت لـ:</strong> ${r.to || '---'}</div>
                    <div style="grid-column: span 2; margin-top: 4px;"><strong>المدة المتبقية:</strong> ${remainingText}</div>
                </div>
                <div class="admin-action-section" style="display: ${isAdmin ? 'block' : 'none'};">
                    <div class="record-footer">
                        <button class="btn btn-edit" onclick="editRecord(${r.id})">✏️ تعديل</button>
                        <button class="btn btn-delete" onclick="deleteRecord(${r.id})">🗑️ حذف</button>
                    </div>
                </div>
            `;
            listContainer.appendChild(div);
        });
    }

    renderRecords();
</script>

</body>
</html>
