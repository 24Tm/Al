<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة المعاملات</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #1e293b 100%);
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #1d4ed8;
            --primary-hover: #1e40af;
            --success: #15803d;
            --danger: #b91c1c;
            --warning: #b45309;
            --border-color: #e2e8f0;
        }
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-gradient); 
            min-height: 100vh;
            margin: 0; 
            padding: 20px; 
            color: var(--text-main); 
            font-size: 16px;
        }
        
        .container { max-width: 900px; margin: 0 auto; }

        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: #ffffff; margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        
        /* زر تسجيل الدخول الاحترافي المصغر */
        .mini-auth-btn { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; backdrop-filter: blur(8px); transition: all 0.2s ease; }
        .mini-auth-btn:hover { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.4); }

        /* التبويبات العلوية */
        .tabs-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; background: rgba(255, 255, 255, 0.1); color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.1); padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; transition: all 0.2s ease; }
        .tab-btn.active { background: var(--primary); color: #fff; border-color: transparent; box-shadow: 0 4px 15px rgba(29, 78, 216, 0.4); }

        /* لوحة العدادات الإحصائية */
        .dashboard-stats { display: flex; gap: 12px; margin-bottom: 20px; }
        .stat-card { flex: 1; background: var(--card-bg); padding: 16px; border-radius: 12px; text-align: center; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); border: 1px solid rgba(255, 255, 255, 0.1); }
        .stat-card .label-text { font-size: 13px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .stat-card .number { font-size: 26px; font-weight: 800; display: block; margin-top: 6px; }
        .stat-in-progress .number { color: var(--primary); }
        .stat-delayed .number { color: var(--danger); }
        .stat-completed .number { color: var(--success); }

        /* بطاقة النموذج */
        .card { background: var(--card-bg); padding: 24px; border-radius: 16px; box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.2); margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .card h3 { margin-top: 0; font-size: 20px; color: var(--primary); font-weight: 700; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        
        .form-row { display: flex; gap: 12px; margin-bottom: 12px; }
        .form-group { flex: 1; }

        label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 14px; color: var(--text-muted); }
        input, select, textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 16px; box-sizing: border-box; background: #f8fafc; color: var(--text-main); transition: all 0.2s; }
        input:focus, select:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15); }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button.action-btn { background: var(--primary); color: white; border: none; padding: 14px 20px; border-radius: 10px; font-size: 16px; cursor: pointer; flex: 1; font-weight: 700; box-shadow: 0 4px 12px rgba(29, 78, 216, 0.3); transition: 0.2s; }
        button.action-btn:hover { background: var(--primary-hover); }
        .btn-pdf { background: #0284c7; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
        .btn-pdf:hover { background: #0369a1; }
        .btn-reset { background: #64748b; box-shadow: 0 4px 12px rgba(100, 116, 139, 0.3); }
        
        .btn-edit { background: var(--warning); color: #fff; padding: 8px 14px; font-size: 14px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; }
        .btn-delete { background: var(--danger); color: #fff; padding: 8px 14px; font-size: 14px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; }

        /* صندوق البحث */
        .search-box { margin-bottom: 20px; }
        .search-box input { padding: 14px 18px; border-radius: 12px; font-size: 16px; background: rgba(255, 255, 255, 0.95); border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        /* بطاقات المعاملات */
        .record-item { padding: 20px; border-radius: 14px; margin-bottom: 14px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); position: relative; border: 1px solid var(--border-color); background: #fff; transition: transform 0.2s; }
        .record-item:hover { transform: translateY(-2px); }
        .record-item.bg-red { background-color: #fef2f2 !important; border-color: #fca5a5; }
        .record-item.bg-green { background-color: #f0fdf4 !important; border-color: #86efac; }
        .record-item.bg-normal { background-color: #ffffff !important; }

        .record-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 18px; margin-bottom: 10px; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 8px; }
        .record-details { font-size: 15px; color: #334155; line-height: 1.8; }
        
        .badge { display: inline-block; padding: 5px 10px; border-radius: 8px; font-size: 13px; font-weight: 700; }
        .badge-green { background: #dcfce7; color: #166534; }
        .badge-red { background: #fee2e2; color: #991b1b; }
        .badge-orange { background: #ffedd5; color: #9a3412; }

        .admin-only { display: none; }

        @media print {
            body { background: white !important; color: black !important; padding: 0; }
            .no-print { display: none !important; }
            .record-item { border: 1px solid #cbd5e1 !important; break-inside: avoid; margin-bottom: 15px; box-shadow: none !important; }
            .print-container { display: block !important; }
        }
        .print-container { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header no-print">
        <h2>متابعة المعاملات</h2>
        <button class="mini-auth-btn" id="authToggleBtn" onclick="toggleAuth()">🔒 تسجيل الدخول</button>
    </div>

    <!-- لوحة العدادات الإحصائية -->
    <div class="dashboard-stats no-print">
        <div class="stat-card stat-in-progress">
            <span class="label-text">⏳ تحت الإجراء</span>
            <span class="number" id="countInProgress">0</span>
        </div>
        <div class="stat-card stat-delayed">
            <span class="label-text">🔴 متأخرة</span>
            <span class="number" id="countDelayed">0</span>
        </div>
        <div class="stat-card stat-completed">
            <span class="label-text">✅ المنجزة</span>
            <span class="number" id="countCompleted">0</span>
        </div>
    </div>

    <!-- التبويبات -->
    <div class="tabs-container no-print">
        <button class="tab-btn active" id="tabActive" onclick="switchTab('active')">المعاملات النشطة والمتأخرة</button>
        <button class="tab-btn" id="tabCompleted" onclick="switchTab('completed')">المعاملات المنجزة</button>
    </div>

    <!-- نموذج الإضافة والتعديل (للأدمن) -->
    <div class="card admin-only no-print" id="adminFormCard">
        <h3 id="formTitle">➕ إضافة معاملة جديدة</h3>
        <input type="hidden" id="recordId">
        
        <div class="form-row">
            <div class="form-group">
                <label>رقم المعاملة:</label>
                <input type="text" id="transNumber" placeholder="أدخل رقم المعاملة">
            </div>
            <div class="form-group">
                <label>تاريخ المعاملة (هجري / ميلادي):</label>
                <input type="date" id="transDate">
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 12px;">
            <label>موضوع المعاملة:</label>
            <input type="text" id="transSubject" placeholder="أدخل موضوع المعاملة باختصار">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>صادرة من:</label>
                <input type="text" id="transFrom" placeholder="الجهة المصدرة">
            </div>
            <div class="form-group">
                <label>حولت لـ:</label>
                <input type="text" id="transTo" placeholder="الجهة المحولة لها">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>الوحدة:</label>
                <select id="transUnit">
                    <option value="العموم">العموم</option>
                    <option value="الادارية">الادارية</option>
                    <option value="العمليات">العمليات</option>
                    <option value="التموين">التموين</option>
                    <option value="الاولى">الاولى</option>
                    <option value="الثانية">الثانية</option>
                    <option value="الاسناد">الاسناد</option>
                </select>
            </div>
            <div class="form-group">
                <label>الحالة:</label>
                <select id="transStatus">
                    <option value="لم تنجز">لم تنجز</option>
                    <option value="أنجزت">أنجزت</option>
                </select>
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 12px;">
            <label>تاريخ الاستحقاق / الانتهاء:</label>
            <input type="date" id="transDueDate">
        </div>

        <div class="btn-group">
            <button class="action-btn" onclick="saveRecord()" id="saveBtnText">حفظ المعاملة</button>
            <button class="action-btn btn-reset" onclick="resetForm()">إلغاء / مسح</button>
            <button class="action-btn btn-pdf" onclick="exportDelayedPDF()">📄 تقرير المتأخرات PDF</button>
        </div>
    </div>

    <!-- شريط البحث -->
    <div class="search-box no-print">
        <input type="text" id="searchQuery" placeholder="🔍 ابحث برقم المعاملة، الموضوع، الوحدة، أو الجهات..." oninput="renderRecords()">
    </div>

    <!-- قائمة المعاملات -->
    <div id="recordsList" class="no-print"></div>

    <!-- مساحة مخصصة للطباعة وتصدير PDF -->
    <div id="printArea" class="print-container"></div>
</div>

<script>
    let isAdmin = false;
    let currentTab = 'active';

    document.getElementById('transDate').valueAsDate = new Date();
    let defDue = new Date();
    defDue.setDate(defDue.getDate() + 15);
    document.getElementById('transDueDate').valueAsDate = defDue;

    function toggleAuth() {
        if (!isAdmin) {
            let pass = prompt("الرجاء إدخال كلمة المرور:");
            if (pass === "Dd1616") {
                isAdmin = true;
                document.getElementById('authToggleBtn').innerText = "🔓 خروج الأدمن";
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                renderRecords();
            } else if (pass !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        } else {
            isAdmin = false;
            document.getElementById('authToggleBtn').innerText = "🔒 تسجيل الدخول";
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
            resetForm();
            renderRecords();
        }
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabActive').classList.toggle('active', tab === 'active');
        document.getElementById('tabCompleted').classList.toggle('active', tab === 'completed');
        renderRecords();
    }

    function getRecords() {
        return JSON.parse(localStorage.getItem('persistent_transactions_v2') || '[]');
    }

    function saveRecord() {
        if (!isAdmin) return;
        let id = document.getElementById('recordId').value;
        let number = document.getElementById('transNumber').value.trim();
        let date = document.getElementById('transDate').value;
        let subject = document.getElementById('transSubject').value.trim();
        let from = document.getElementById('transFrom').value.trim();
        let to = document.getElementById('transTo').value.trim();
        let unit = document.getElementById('transUnit').value;
        let status = document.getElementById('transStatus').value;
        let dueDate = document.getElementById('transDueDate').value;

        if (!number || !subject || !date || !dueDate) {
            alert('الرجاء إدخال الحقول الأساسية المطلوبة (رقم المعاملة، الموضوع، وتواريخ البداية والاستحقاق)');
            return;
        }

        let records = getRecords();

        if (id) {
            records = records.map(r => r.id == id ? { id: Number(id), number, date, subject, from, to, unit, status, dueDate } : r);
        } else {
            records.push({ id: Date.now(), number, date, subject, from, to, unit, status, dueDate });
        }

        localStorage.setItem('persistent_transactions_v2', JSON.stringify(records));
        resetForm();
        renderRecords();
    }

    function editRecord(id) {
        if (!isAdmin) return;
        let records = getRecords();
        let r = records.find(item => item.id == id);
        if (!r) return;

        document.getElementById('recordId').value = r.id;
        document.getElementById('transNumber').value = r.number;
        document.getElementById('transDate').value = r.date;
        document.getElementById('transSubject').value = r.subject;
        document.getElementById('transFrom').value = r.from || '';
        document.getElementById('transTo').value = r.to || '';
        document.getElementById('transUnit').value = r.unit || 'العموم';
        document.getElementById('transStatus').value = r.status;
        document.getElementById('transDueDate').value = r.dueDate;
        
        document.getElementById('formTitle').innerText = "✏️ تعديل المعاملة";
        document.getElementById('saveBtnText').innerText = "تحديث البيانات";
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function deleteRecord(id) {
        if (!isAdmin) return;
        if (confirm('هل أنت متأكد من حذف هذه المعاملة نهائياً؟')) {
            let records = getRecords().filter(r => r.id !== id);
            localStorage.setItem('persistent_transactions_v2', JSON.stringify(records));
            renderRecords();
        }
    }

    function resetForm() {
        document.getElementById('recordId').value = '';
        document.getElementById('transNumber').value = '';
        document.getElementById('transSubject').value = '';
        document.getElementById('transFrom').value = '';
        document.getElementById('transTo').value = '';
        document.getElementById('transUnit').value = 'العموم';
        document.getElementById('transStatus').value = 'لم تنجز';
        document.getElementById('formTitle').innerText = "➕ إضافة معاملة جديدة";
        document.getElementById('saveBtnText').innerText = "حفظ المعاملة";
    }

    function exportDelayedPDF() {
        let records = getRecords();
        let today = new Date();
        today.setHours(0,0,0,0);

        let delayed = records.filter(r => {
            let dueD = new Date(r.dueDate);
            let diffDays = Math.ceil((dueD - today) / (1000 * 60 * 60 * 24));
            return diffDays < 0 && r.status === 'لم تنجز';
        });

        if (delayed.length === 0) {
            alert('لا توجد معاملات متأخرة ولم تنجز لتصديرها.');
            return;
        }

        let printArea = document.getElementById('printArea');
        let printHTML = `
            <div style="direction: rtl; font-family: Tahoma, sans-serif; padding: 20px; color: #000;">
                <h2 style="text-align: center; color: #b91c1c; font-size: 24px;">تقرير المعاملات المتأخرة (ولم تنجز)</h2>
                <p style="text-align: center; color: #555; font-size: 14px;">تاريخ التقرير: ${new Date().toLocaleDateString('ar-SA')}</p>
                <hr style="border: 0; border-top: 2px solid #ccc; margin: 15px 0;">
        `;

        delayed.forEach((r, index) => {
            let dueD = new Date(r.dueDate);
            let diffDays = Math.abs(Math.ceil((dueD - today) / (1000 * 60 * 60 * 24)));
            printHTML += `
                <div style="border: 1px solid #f87171; background: #fee2e2; padding: 12px; margin-bottom: 12px; border-radius: 6px;">
                    <strong style="font-size: 16px;">${index + 1}. رقم المعاملة: ${r.number}</strong>
                    <div style="font-size: 14px; margin-top: 4px;"><strong>الموضوع:</strong> ${r.subject}</div>
                    <div style="font-size: 13px; color: #444; margin-top: 3px;"><strong>الوحدة:</strong> ${r.unit || '---'} &nbsp;|&nbsp; <strong>من:</strong> ${r.from || '---'} &nbsp;|&nbsp; <strong>إلى:</strong> ${r.to || '---'}</div>
                    <div style="font-size: 14px; color: #991b1b; font-weight: bold; margin-top: 6px;">⚠️ متأخرة بمقدار: ${diffDays} يوم عن تاريخ الاستحقاق (${r.dueDate})</div>
                </div>
            `;
        });

        printHTML += `</div>`;
        printArea.innerHTML = printHTML;
        window.print();
        setTimeout(() => { printArea.innerHTML = ''; }, 1000);
    }

    function renderRecords() {
        let listContainer = document.getElementById('recordsList');
        let query = document.getElementById('searchQuery').value.toLowerCase();
        let records = getRecords();
        let today = new Date();
        today.setHours(0,0,0,0);

        listContainer.innerHTML = '';

        let inProgressCount = 0;
        let completedCount = 0;
        let delayedCount = 0;

        records.forEach(r => {
            let dueD = new Date(r.dueDate);
            let diffDays = Math.ceil((dueD - today) / (1000 * 60 * 60 * 24));
            if (diffDays < 0 && r.status === 'لم تنجز') {
                delayedCount++;
            } else if (r.status === 'أنجزت') {
                completedCount++;
            } else {
                inProgressCount++;
            }
        });

        document.getElementById('countInProgress').innerText = inProgressCount;
        document.getElementById('countDelayed').innerText = delayedCount;
        document.getElementById('countCompleted').innerText = completedCount;

        let filtered = records.filter(r => {
            let dueD = new Date(r.dueDate);
            let diffDays = Math.ceil((dueD - today) / (1000 * 60 * 60 * 24));

            if (currentTab === 'active') {
                return r.status !== 'أنجزت';
            } else {
                return r.status === 'أنجزت';
            }
        });

        filtered = filtered.filter(r => 
            r.number.toLowerCase().includes(query) || 
            r.subject.toLowerCase().includes(query) || 
            (r.unit && r.unit.toLowerCase().includes(query)) || 
            (r.from && r.from.toLowerCase().includes(query)) || 
            (r.to && r.to.toLowerCase().includes(query))
        );

        if (filtered.length === 0) {
            listContainer.innerHTML = '<p style="text-align:center; color:#fff; padding: 25px; font-size: 16px; background: rgba(255,255,255,0.05); border-radius: 12px;">لا توجد معاملات مطابقة في هذا القسم</p>';
            return;
        }

        filtered.reverse().forEach(r => {
            let dueD = new Date(r.dueDate);
            let diffDays = Math.ceil((dueD - today) / (1000 * 60 * 60 * 24));

            let cardBgClass = 'bg-normal';
            let statusBadge = '';
            let remainingText = '';

            if (r.status === 'أنجزت') {
                cardBgClass = 'bg-green';
                statusBadge = `<span class="badge badge-green">✅ منجزة</span>`;
                remainingText = `تمت بنجاح`;
            } else {
                if (diffDays < 0) {
                    cardBgClass = 'bg-red';
                    statusBadge = `<span class="badge badge-red">🔴 متأخرة ولم تنجز</span>`;
                    remainingText = `متأخرة بـ ${Math.abs(diffDays)} يوم`;
                } else if (diffDays <= 5) {
                    statusBadge = `<span class="badge badge-orange">🟠 تنتهي قريبًا</span>`;
                    remainingText = `متبقي ${diffDays} يوم`;
                } else {
                    statusBadge = `<span class="badge badge-green">🟢 نشطة</span>`;
                    remainingText = `متبقي ${diffDays} يوم`;
                }
            }

            let div = document.createElement('div');
            div.className = `record-item ${cardBgClass}`;
            div.innerHTML = `
                <div class="record-header">
                    <span>📁 المعاملة رقم: ${r.number}</span>
                    <span>${statusBadge}</span>
                </div>
                <div class="record-details">
                    <div><strong>الموضوع:</strong> ${r.subject}</div>
                    <div style="margin-top: 4px;"><strong>الوحدة:</strong> ${r.unit || '---'}</div>
                    <div style="margin-top: 4px;"><strong>التاريخ:</strong> ${r.date} &nbsp;|&nbsp; <strong>الاستحقاق:</strong> ${r.dueDate}</div>
                    <div style="margin-top: 4px;"><strong>صادرة من:</strong> ${r.from || '---'} &nbsp;|&nbsp; <strong>حولت لـ:</strong> ${r.to || '---'}</div>
                    <div style="margin-top: 6px; font-weight: bold; color: #0f172a;">⏱️ المدة المتبقية للانجاز: ${remainingText}</div>
                </div>
                <div class="admin-action-section" style="margin-top: 12px; border-top: 1px solid rgba(0,0,0,0.08); padding-top: 10px; display: ${isAdmin ? 'block' : 'none'};">
                    <button class="btn-edit" onclick="editRecord(${r.id})">✏️ تعديل</button>
                    <button class="btn-delete" onclick="deleteRecord(${r.id})" style="margin-right: 8px;">🗑️ حذف</button>
                </div>
            `;
            listContainer.appendChild(div);
        });
    }

    renderRecords();
</script>

</body>
</html>
