<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة السجلات المتقدم</title>
    <style>
        :root {
            --primary: #007aff;
            --success: #34c759;
            --warning: #ff9500;
            --danger: #ff3b30;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #d1d1d6;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--text); }
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h2 { color: #2c3e50; margin: 0; font-size: 20px; }
        .auth-badge { font-size: 12px; padding: 5px 10px; border-radius: 20px; background: #e5e5ea; cursor: pointer; font-weight: bold; }
        .auth-badge.admin { background: #e1f5fe; color: #0288d1; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; transition: all 0.3s ease; }
        .hidden { display: none !important; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; color: #48484a; }
        input, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; box-sizing: border-box; background: #fafafa; }
        input:focus { border-color: var(--primary); outline: none; background: #fff; }
        button.action-btn { background: var(--primary); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 15px; cursor: pointer; transition: background 0.2s; }
        button.action-btn:active { background: #005bb5; }
        .record-item { background: var(--card-bg); padding: 15px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); position: relative; border-right: 4px solid var(--primary); }
        .record-title { font-weight: bold; font-size: 16px; color: #1c1c1e; }
        .record-dates { font-size: 13px; color: #8e8e93; margin: 6px 0; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .badge-green { background: #e8f8f5; color: var(--success); }
        .badge-orange { background: #fef5e7; color: var(--warning); }
        .badge-red { background: #fdf2f2; color: var(--danger); }
        .delete-btn { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; float: left; cursor: pointer; font-weight: bold; }
        .search-box input { background: #fff; border-radius: 20px; padding-left: 20px; padding-right: 20px; }
    </style>
</head>
<body>

    <div class="header-container">
        <h2>إدارة السجلات</h2>
        <div id="authStatus" class="auth-badge" onclick="toggleRole()">👤 زائر (اطلاع فقط)</div>
    </div>

    <!-- نموذج الإضافة يظهر للمشرفين فقط -->
    <div id="adminFormCard" class="card hidden">
        <h3 style="margin-top:0; font-size:16px; color:#1c1c1e;">إضافة سجل جديد</h3>
        <label>اسم السجل / الجهة:</label>
        <input type="text" id="title" placeholder="أدخل اسم السجل">

        <label>تاريخ البداية:</label>
        <input type="date" id="startDate">

        <label>تاريخ النهاية:</label>
        <input type="date" id="endDate">

        <label>ملاحظات:</label>
        <input type="text" id="notes" placeholder="ملاحظات اختيارية">

        <button class="action-btn" onclick="saveRecord()">حفظ السجل</button>
    </div>

    <div class="search-box">
        <input type="text" id="searchQuery" placeholder="🔍 بحث سريع في السجلات..." oninput="renderRecords()">
    </div>

    <div id="recordsList"></div>

<script>
    // كلمة المرور الخاصة بالمشرف (يمكنك تغييرها هنا)
    const ADMIN_PASSWORD = "123"; 

    let isAdmin = localStorage.getItem('is_admin') === 'true';

    document.getElementById('startDate').valueAsDate = new Date();
    let endDateDefault = new Date();
    endDateDefault.setDate(endDateDefault.getDate() + 30);
    document.getElementById('endDate').valueAsDate = endDateDefault;

    updateUIState();

    function toggleRole() {
        if (!isAdmin) {
            let pass = prompt("الرجاء إدخال كلمة مرور المشرف:");
            if (pass === ADMIN_PASSWORD) {
                isAdmin = true;
                localStorage.setItem('is_admin', 'true');
                alert("تم تفعيل صلاحيات المشرف بنجاح.");
            } else if (pass !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        } else {
            if (confirm("هل تريد تسجيل الخروج من صلاحيات المشرف والعودة لوضع الزائر؟")) {
                isAdmin = false;
                localStorage.setItem('is_admin', 'false');
            }
        }
        updateUIState();
        renderRecords();
    }

    function updateUIState() {
        let badge = document.getElementById('authStatus');
        let formCard = document.getElementById('adminFormCard');
        
        if (isAdmin) {
            badge.innerText = "👑 مشرف (تحكم كامل)";
            badge.className = "auth-badge admin";
            formCard.classList.remove('hidden');
        } else {
            badge.innerText = "👤 زائر (اطلاع فقط)";
            badge.className = "auth-badge";
            formCard.classList.add('hidden');
        }
    }

    function getRecords() {
        return JSON.parse(localStorage.getItem('my_records') || '[]');
    }

    function saveRecord() {
        if (!isAdmin) return;
        let title = document.getElementById('title').value.trim();
        let startDate = document.getElementById('startDate').value;
        let endDate = document.getElementById('endDate').value;
        let notes = document.getElementById('notes').value.trim();

        if(!title || !startDate || !endDate) {
            alert('الرجاء إدخال الاسم وتواريخ البداية والنهاية');
            return;
        }

        let records = getRecords();
        records.push({ id: Date.now(), title, startDate, endDate, notes });
        localStorage.setItem('my_records', JSON.stringify(records));

        document.getElementById('title').value = '';
        document.getElementById('notes').value = '';
        renderRecords();
    }

    function deleteRecord(id) {
        if (!isAdmin) {
            alert("عذراً، الصلاحية متاحة للمشرفين فقط.");
            return;
        }
        if(confirm('هل أنت متأكد من حذف هذا السجل؟')) {
            let records = getRecords().filter(r => r.id !== id);
            localStorage.setItem('my_records', JSON.stringify(records));
            renderRecords();
        }
    }

    function renderRecords() {
        let listContainer = document.getElementById('recordsList');
        let query = document.getElementById('searchQuery').value.toLowerCase();
        let records = getRecords();
        let today = new Date();
        today.setHours(0,0,0,0);

        listContainer.innerHTML = '';

        let filtered = records.filter(r => r.title.toLowerCase().includes(query) || (r.notes && r.notes.toLowerCase().includes(query)));

        if(filtered.length === 0) {
            listContainer.innerHTML = '<p style="text-align:center; color:#8e8e93; margin-top:30px;">لا توجد سجلات مطابقة</p>';
            return;
        }

        filtered.reverse().forEach(r => {
            let endD = new Date(r.endDate);
            let diffTime = endD - today;
            let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            let statusHtml = '';
            if(diffDays < 0) {
                statusHtml = `<span class="badge badge-red">🔴 متأخر (${Math.abs(diffDays)} يوم)</span>`;
            } else if(diffDays <= 7) {
                statusHtml = `<span class="badge badge-orange">🟠 ينتهي قريبًا (باقي ${diffDays} يوم)</span>`;
            } else {
                statusHtml = `<span class="badge badge-green">🟢 باقي (${diffDays} يوم)</span>`;
            }

            // زر الحذف يظهر فقط إذا كان المستخدم مشرفاً
            let deleteBtnHtml = isAdmin ? `<button class="delete-btn" onclick="deleteRecord(${r.id})">حذف</button>` : '';

            let div = document.createElement('div');
            div.className = 'record-item';
            div.innerHTML = `
                ${deleteBtnHtml}
                <div class="record-title">${r.title}</div>
                <div class="record-dates">من: ${r.startDate} &nbsp;|& colspan="2"&nbsp; إلى: ${r.endDate}</div>
                ${r.notes ? `<div style="font-size:13px; color:#555; margin-bottom:8px;">ملاحظات: ${r.notes}</div>` : ''}
                <div>${statusHtml}</div>
            `;
            listContainer.appendChild(div);
        });
    }

    renderRecords();
</script>

</body>
</html>
