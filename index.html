<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النظام الرئيسي - متابعة المعاملات</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            padding: 8px 15px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #c82333;
        }
        .content {
            margin-top: 20px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>نظام متابعة المعاملات</h2>
        <div>
            <span id="user-email" style="margin-left: 15px; color: #555;"></span>
            <button id="logout-btn">تسجيل الخروج</button>
        </div>
    </div>

    <div class="content">
        <h3>مرحباً بك في لوحة التحكم</h3>
        <p>تم تسجيل دخولك بنجاح إلى النظام.</p>
    </div>

    <!-- استيراد مكتبات Firebase عبر CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // إعدادات مشروع الـ Firebase الخاص بك
        const firebaseConfig = {
          apiKey: "AIzaSyC4tcL7HF_eWO2r7JH3D8ptnyTuwk0vSlw",
          authDomain: "project-3958113961260211077.firebaseapp.com",
          projectId: "project-3958113961260211077",
          storageBucket: "project-3958113961260211077.firebasestorage.app",
          messagingSenderId: "889377835896",
          appId: "1:889377835896:web:bbbb74e99b3585c9d8168d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // التحقق من حالة تسجيل الدخول
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // المستخدم مسجل الدخول بنجاح
                document.getElementById('user-email').textContent = user.email;
            } else {
                // إذا لم يكن مسجلاً، أعده لصفحة الدخول
                window.location.href = "login.html";
            }
        });

        // زر تسجيل الخروج
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            }).catch((error) => {
                console.error("خطأ في تسجيل الخروج", error);
            });
        });
    </script>
</body>
</html>
