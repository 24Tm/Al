<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - النظام الإداري</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            position: relative;
            transition: all 0.3s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #f1f5f9;
        }

        .login-header p {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        /* Role Switcher Tabs */
        .role-switcher {
            display: flex;
            background: #0f172a;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
        }

        .role-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .role-btn.active {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* Dynamic style when Admin is selected */
        .login-container.admin-mode .role-btn.active {
            background: #d97706; /* لون ذهبي/برتقالي رصين للمسؤول */
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
        }

        .login-container.admin-mode {
            border-color: #d9770655;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .login-container.admin-mode .form-control:focus {
            border-color: #d97706;
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            background: #2563eb;
        }

        .login-container.admin-mode .submit-btn {
            background: #d97706;
        }

        .login-container.admin-mode .submit-btn:hover {
            background: #b45309;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .system-status {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #64748b;
            border-top: 1px solid #334155;
            padding-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="login-container" id="loginCard">
        <div class="login-header">
            <h2>تسجيل الدخول للنظام</h2>
            <p id="roleDescription">يرجى إدخال البيانات الخاصة بالمستخدم العادي</p>
        </div>

        <!-- تبديل الصلاحيات -->
        <div class="role-switcher">
            <button type="button" class="role-btn active" id="userTab" onclick="setRole('user')">مستخدم عادي</button>
            <button type="button" class="role-btn" id="adminTab" onclick="setRole('admin')">صلاحية المسؤول</button>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label id="idLabel" for="username">اسم المستخدم أو الرقم الوظيفي</label>
                <input type="text" id="username" class="form-control" placeholder="أدخل المعرف هنا" required>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">دخول النظام</button>
        </form>

        <div class="system-status">
            الحالة: النظام آمن ومتصل • الإصدار 2.6
        </div>
    </div>

    <script>
        function setRole(role) {
            const card = document.getElementById('loginCard');
            const userTab = document.getElementById('userTab');
            const adminTab = document.getElementById('adminTab');
            const roleDesc = document.getElementById('roleDescription');
            const idLabel = document.getElementById('idLabel');

            if (role === 'admin') {
                card.classList.add('admin-mode');
                adminTab.classList.add('active');
                userTab.classList.remove('active');
                roleDesc.textContent = 'منطقة مخصصة لمسؤولي النظام وصلاحيات الإشراف العليا';
                idLabel.textContent = 'معرف المسؤول / السجل المدني';
            } else {
                card.classList.remove('admin-mode');
                userTab.classList.add('active');
                adminTab.classList.remove('active');
                roleDesc.textContent = 'يرجى إدخال البيانات الخاصة بالمستخدم العادي';
                idLabel.textContent = 'اسم المستخدم أو الرقم الوظيفي';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const isAdmin = document.getElementById('loginCard').classList.contains('admin-mode');
            const user = document.getElementById('username').value;
            
            if (isAdmin) {
                alert(`جاري التحقق من صلاحيات المسؤول للمستخدم: ${user}...`);
            } else {
                alert(`جاري تسجيل دخول المستخدم العادي: ${user}...`);
            }
        }
    </script>

</body>
</html>
